<script id="data" type="application/json">{"generated": "2026-08-29 04:44Z", "state": "---\nupdated: 2026-08-29\n---\n\n# Working memory\n\nLoaded on every boot. Hard ceiling ~60 lines \u2014 prune, don't append.\n\n## Current focus\nAgentOS is now **harness-agnostic**: kernel in `AGENTS.md`, portable config in\n`config/`, per-vendor bindings generated by `adapters/install.sh`. Shipping a\nvisual second brain on an always-on server with hybrid search and a web UI.\n\n## Active loops\n- `deploy-always-on` \u2014 put the vault + UI on a `t3.micro`, reachable over TLS\n- `harden-agentos` \u2014 prove each subsystem survives a real session boundary\n\n## Vault layers\n`brain/raw/` capture \u2192 `brain/wiki/` atomic knowledge \u2192 `brain/output/` artifacts.\nPromote by rewriting, never by moving. Nothing automated writes to `wiki/`.\n\n## Automations (keyless, no API accounts)\n`bin/os radar` pulls 6 feeds (HN, arXiv, HF papers, HF models, GitHub, Lobsters)\ninto `raw/`. `bin/os research \"<topic>\"` gathers on one topic. `bin/os distill`\ntriages the newest capture into `output/`. Daily at 06:15 via systemd.\n\n## Skills\n`research`, `taste` (UI/writing/code/review rubrics), `skill-forge`,\n`loop-engineering`, `second-brain`. All file-set skills with routers.\n\n## Environment facts\n- Sandboxes are ephemeral; **git is the only durable layer**. Push or lose it.\n- Never assume a harness supports hooks, cron, daemons, or global config \u2014\n  audit it. See [[Harness Capability Matrix]].\n- A kernel is only as persistent as its delivery. See [[Binding Beats Building]].\n- Model access is not transferable between vendors; keep the provider behind one\n  env var. See [[Model Access Is Not Transferable]].\n\n## The stack on the server \u2014 LIVE\n- `https://13-218-239-165.sslip.io` \u2014 EC2 `t3.micro`, ~$10/mo. Deployed and\n  reboot-tested 2026-08-29. App uses 247MB of a 700MB systemd cap.\n- Retrieval: SQLite FTS5 (BM25) + sqlite-vec, fused with RRF. Index is\n  disposable; markdown is truth. See [[Grep Beats Embeddings Here]].\n- Embeddings: quantised MiniLM, CPU-only, on-box. Inference: remote,\n  OpenAI-compatible, currently OpenRouter free tier.\n- Auth: user `jm`, password (PBKDF2, per-IP lockout). TLS: Caddy + real Let's\n  Encrypt cert on sslip.io \u2014 no domain, no DNS account, fully automatic.\n- Why a server at all: [[Local Runtime Closes The Gaps]].\n\n## Blocked on the user\n- Add `OPENROUTER_API_KEY` to `server/.env` \u2014 the only thing between the live box\n  and working RAG answers. Search already works without it.\n- **Rotate the EC2 keypair**: the private key was pasted into a chat transcript,\n  and the SG still allows SSH from `0.0.0.0/0`. Narrow it to one IP.\n- Set a billing alarm at $20/mo.\n- Install `config/kernel-global.md` at the harness's global scope so repo-less\n  sessions still boot.\n\n## Recent decisions\n- [[2026-08-19 Steering as the boot loader]] \u2014 an always-included kernel file\n  carries the boot instruction; hooks are an upgrade, not a requirement.\n- Hybrid retrieval for humans and RAG, grep for the agent. Markdown stays\n  authoritative \u2014 the reconciliation is in [[Grep Beats Embeddings Here]].\n\n## Next action\n`bin/os loop next deploy-always-on`\n", "lessons": "---\nupdated: 2026-08-29\n---\n\n# Lessons\n\nActivation-based: each line names the situation that should fire it. A lesson\nwithout a trigger is a note. Wrong lessons get deleted, not archived.\n\n- When starting any session in this repo \u2192 run `bash bin/os boot` before replying. Because the sandbox starts with no memory of the last session. _(2026-08-19)_\n- When a session produces a decision, lesson, or finished step \u2192 `bin/os save` immediately. Because sandbox teardown discards uncommitted work silently. _(2026-08-19)_\n- When work will outlive one context window \u2192 create a loop ledger instead of trusting the transcript. Because context compaction drops the middle of long sessions. _(2026-08-19)_\n- When about to rely on a harness feature (hooks, custom agents, repo-level MCP, global config) \u2192 verify it actually loads in *this* surface first. Because unsupported config fails silently rather than erroring, and you will debug the wrong layer for an hour. _(2026-08-19)_\n- When about to add a note that overlaps an existing one \u2192 rewrite the existing note instead. Because two notes disagreeing is worse than one note being stale. _(2026-08-19)_\n- When `gh pr create` or any `gh pr`/`gh issue` subcommand is tempting \u2192 use `gh api` REST instead. Because the GraphQL-backed subcommands always fail in this sandbox. _(2026-08-19)_\n- When the same loop step fails twice \u2192 stop, write the blocker into the ledger's Notes, escalate. Because a third identical attempt produces confident garbage. _(2026-08-19)_\n- When verifying a generated UI \u2192 load it headless and assert on the DOM, don't assume it renders. Because a template typo produces a blank page that looks fine in source. _(2026-08-19)_\n- When a session starts with an empty workspace or no repo bound \u2192 the brain is not missing, it is uncloned; run the sidecar clone from the global kernel before claiming no context exists. Because repo-resident config cannot load in a session bound to no repo. _(2026-08-19)_\n- When the brain needs to be reachable from any session \u2192 keep it in its own repo on the default branch, cloned by the global kernel to a fixed path. Because hosted harnesses clone only the default branch and offer no branch picker. _(2026-08-19)_\n- When the user wants an agent that is persistent like a real OS (daemon, scheduler, survives reboot) \u2192 that is a machine they control, not a hosted sandbox. Because hosted surfaces have no cron and tear the sandbox down per task. _(2026-08-19)_\n- When asked to run one vendor's models through another vendor's agent CLI \u2192 say no and explain the boundary. Because agent CLIs authenticate only against their own subscription
