<script id="data" type="application/json">{"generated": "2026-08-19 13:53Z", "state": "---\nupdated: 2026-08-19\n---\n\n# Working memory\n\nLoaded on every boot. Hard ceiling ~60 lines \u2014 prune, don't append.\n\n## Current focus\nRunning a persistent agentic OS inside Kiro Web: second brain in `brain/`,\nkernel in `.kiro/steering/`, skills as programs, loops as the control system.\n\n## Active loops\n- `harden-agentos` \u2014 prove each subsystem survives a real session boundary\n\n## Environment facts (Kiro Web, verified 2026-08-19)\n- Sandbox is ephemeral; **git is the only durable layer**. Push or lose it.\n- Works on Web: `.kiro/steering/`, `.kiro/skills/`, `.kiro/specs/`, bash, internet.\n- Does NOT work on Web: hooks, custom agents, repo `.kiro/settings/mcp.json`,\n  skill slash-commands, `~/.kiro` global scope. See [[Kiro Web Capability Matrix]].\n- MCP on Web is configured in Settings \u2192 Agent, not in the repo.\n- Sessions expire after 90 days; PRs and commits do not.\n\n## Open questions\n- Does anything outside the cloned repo survive sandbox teardown? Docs contradict\n  themselves; treat the answer as \"no\" until measured.\n\n## Where the brain lives\n`jmbilbao25/Agentic-OS` (private), on `main`, cloned to\n`/projects/sandbox/Agentic-OS`. Sidecar model \u2014 see [[Binding Beats Building]].\nThe earlier copy on `test-repo` branch `agentos` (PR #11) is superseded; ignore it.\n\n## Blocked on the user\n- Paste `cloud-config/00-agentos-global.md` into Settings \u2192 Cloud configuration.\n  Until then, sessions with no repo selected still boot amnesiac.\n- Enable GitHub Pages on `/docs` if the dashboard should be viewable in a browser\n  (repo is private, so Pages needs a paid plan or making it public).\n\n## Recent decisions\n- [[2026-08-19 Steering as the boot loader]] \u2014 no SessionStart hook on Web, so the\n  always-included kernel file carries the boot instruction instead.\n- Grep over markdown instead of a vector DB. See [[Grep Beats Embeddings Here]].\n\n## Next action\n`bin/os loop next harden-agentos`\n", "lessons": "---\nupdated: 2026-08-19\n---\n\n# Lessons\n\nActivation-based: each line names the situation that should fire it. A lesson\nwithout a trigger is a note. Wrong lessons get deleted, not archived.\n\n- When starting any session in this repo \u2192 run `bash bin/os boot` before replying. Because the sandbox starts with no memory of the last session. _(2026-08-19)_\n- When a session produces a decision, lesson, or finished step \u2192 `bin/os save` immediately. Because sandbox teardown discards uncommitted work silently. _(2026-08-19)_\n- When work will outlive one context window \u2192 create a loop ledger instead of trusting the transcript. Because context compaction drops the middle of long sessions. _(2026-08-19)_\n- When reaching for a hook, custom agent, or repo `mcp.json` on Kiro Web \u2192 stop, none of them load; use steering + skills + a shell script. Because Web only reads `.kiro/steering`, `.kiro/skills`, `.kiro/specs`. _(2026-08-19)_\n- When about to add a note that overlaps an existing one \u2192 rewrite the existing note instead. Because two notes disagreeing is worse than one note being stale. _(2026-08-19)_\n- When `gh pr create` or any `gh pr`/`gh issue` subcommand is tempting \u2192 use `gh api` REST instead. Because the GraphQL-backed subcommands always fail in this sandbox. _(2026-08-19)_\n- When the same loop step fails twice \u2192 stop, write the blocker into the ledger's Notes, escalate. Because a third identical attempt produces confident garbage. _(2026-08-19)_\n- When verifying a generated UI \u2192 load it headless and assert on the DOM, don't assume it renders. Because a template typo produces a blank page that looks fine in source. _(2026-08-19)_\n- When a session starts with an empty workspace or no repo bound \u2192 the brain is not missing, it is unclone; run the sidecar clone from the global kernel before claiming no context exists. Because repo-resident steering cannot load in a session bound to no repo. _(2026-08-19)_\n- When the brain needs to be reachable from any session \u2192 keep it in its own repo on the default branch, cloned by the global kernel to a fixed path. Because Kiro Web clones only the default branch of a bound repo and offers no branch picker. _(2026-08-19)_\n", "loops": [{"name": "harden-agentos", "status": "open", "steps": [[true, "scaffold kernel steering, skills, vault, `bin/os`, dashboard"], [true, "verify `boot`, `selftest`, and `dash` run clean in this sandbox"], [true, "push to a remote and confirm `save` round-trips (this is the durability test)"], [false, "open a fresh Kiro Web session on this repo, boot cold, confirm context loads"], [false, "clone locally, open `brain/` in Obsidian, confirm graph and links resolve"], [false, "enable GitHub Pages on `docs/` and confirm the dashboard renders"], [false, "run one non-trivial task end to end using only loop + save discipline"], [false, "prune whatever turned out to be dead weight \u2014 deletion is a step too"]], "body": "---\nloop: harden-agentos\nstatus: open\ncheck: bash bin/os selftest\ncreated: 2026-08-19\n---\n\n# Goal\nProve every AgentOS subsystem actually survives a real session boundary in Kiro\nWeb, and fix whatever doesn't. The claim under test: a fresh session with zero\nconversation history can reconstruct full working context from `bin/os boot`\nalone, and hand it back off cleanly.\n\n# Done when\n`bash bin/os selftest` passes, and a brand-new session \u2014 no prior transcript \u2014\ncorrectly answers \"what were we doing and what's next?\" using only the boot\noutput, then advances one step of this loop and pushes it.\n\n# Steps\n- [x] scaffold kernel steering, skills, vault, `bin/os`, dashboard\n- [x] verify `boot`, `selftest`, and `dash` run clean in this sandbox\n- [x] push to a remote and confirm `save` round-trips (this is the durability test)\n- [ ] open a fresh Kiro Web session on this repo, boot cold, confirm context loads\n- [ ] clone locally, open `brain/` in Obsidian, confirm graph and links resolve\n- [ ] enable GitHub Pages on `docs/` and confirm the dashboard renders\n- [ ] run one non-trivial task end to end using only loop + save discipline\n- [ ] prune whatever turned out to be dead weight \u2014 deletion is a step too\n\n# Notes\n- 2026-08-19: `boot` output is ~40 lines with a seeded vault. Watch that number as\n  the journal grows; boot prints only the last two entries for that reason.\n- Durability is the one property that cannot be verified inside a single session.\n  Steps 3 and 4 are the real test; everything before them is scaffolding.\n- 2026-08-19: `bin/os save` round-trip confirmed against origin/agentos. Repo creation via the sandbox gateway is blocked (403 REST, GraphQL passthrough refused), so AgentOS ships as a branch/PR on an existing repo.\n- 2026-08-19: step 4 first attempt FAILED \u2014 session had no repo bound, so nothing cloned. Root cause and fix in [[Binding Beats Building]]. Sidecar clone+boot verified from an empty workspace; the remaining half of step 4 is a fresh session *with the global kernel installed*.\n- 2026-08-19: I ticked step 4 without doing it. Untucked. Step 4 requires a fresh session on the user side; no in-session evidence can satisfy it. What IS verified: the exact global-kernel boot command works from an empty workspace against the new repo.\n"}], "journal": [{"name": "2026-08-19", "body": "---\ndate: 2026-08-19\n---\n\n# 2026-08-19\n\n- Researched whether a persistent agentic OS can run inside Kiro. Answer: yes, but\n  only on the primitives Web actually loads \u2014 steering, skills, specs, bash, git.\n- Established the binding constraints. Hooks, custom agents, and repo `mcp.json`\n  are unavailable on Kiro Web; the sandbox is torn down per task. Recorded in\n  [[Kiro Web Capability Matrix]] and [[Git Is The Disk]].\n- Chose `inclusion: always` steering as the boot loader instead of a\n  `SessionStart` hook. Decision and tradeoff written up.\n- Built the runtime: `bin/os` (boot/log/lesson/note/decide/recall/loop/dash/save/\n  selftest), `bin/osutil.py` for parsing and the dashboard, seeded `brain/`.\n- Adapted the Ralph loop to a surface where the agent can't re-invoke itself: the\n  ledger is the loop counter, the session is the loop body. See [[Ralph Loop]].\n- Skipped a vector store. Grep plus a hot `STATE.md` covers retrieval at this\n  scale; reasoning in [[Grep Beats Embeddings Here]].\n- 13:24Z \u2014 pushed to origin/agentos and opened PR #11; dashboard verified rendering in a headless browser (5 notes, 25 wikilinks, tab nav and filter all work)\n- 13:44Z \u2014 cold-boot test failed for a binding reason, not a design one: session had no repo selected, and main has no .kiro since PR #11 is unmerged. Added a self-bootstrapping global kernel for Settings -> Cloud configuration; verified clone+boot from a fully empty workspace.\n- 13:52Z \u2014 migrated the brain from test-repo/agentos into its own private repo jmbilbao25/Agentic-OS on main; global kernel now clones to /projects/sandbox/Agentic-OS with no branch flag\n"}], "notes": [{"name": "Binding Beats Building", "body": "---\ncreated: 2026-08-19\ntags: [kiro, constraints, postmortem]\n---\n\n# Binding Beats Building\n\nFirst cold-boot test failed. A fresh Kiro Web session asked \"what are we doing?\"\nand answered \"nothing \u2014 empty workspace, no prior context.\" The OS was fine. The\nsession was never bound to anything containing it.\n\nTwo independent causes, both about delivery rather than design:\n\n1. **No repo selected.** Kiro Web clones repos server-side at session creation. No\n   repo \u2192 no clone \u2192 no `.kiro/steering/` \u2192 no kernel \u2192 no boot. The kernel cannot\n   bootstrap itself from a repo it was never given.\n2. **Wrong branch even if selected.** Web clones the *default* branch and offers no\n   branch picker. The OS lived on an unmerged branch, so `main` had no `.kiro/` at\n   all. A repo-bound session would still have booted empty.\n\nThe general lesson: **a config-file OS is only as persistent as its delivery\nmechanism.** Steering-as-kernel gives you persistence *within a bound repo*; it\ngives you nothing in a session bound to nothing. Those are different guarantees\nand it is easy to conflate them.\n\nThe fix is a second kernel at a scope above the repo. Kiro Web's **Cloud\nconfiguration** (Settings \u2192 Cloud configuration) injects personal steering into\nevery web sandbox regardless of repo \u2014 confirmed by watching a repo-less session\nlog \"Fetching your cloud config\" and apply personal steering with an empty\nworkspace. That kernel has to be **self-bootstrapping**: it can't reference\n`bin/os` because in a repo-less sandbox no such file exists yet. So it carries the\nclone command and treats the brain as a sidecar repo with its own remote.\n\nVerified: from a completely empty `/projects/sandbox`, a shallow clone of the\nbrain branch followed by `bin/os boot` reconstructs full working memory. One\ncommand, no repo binding, ~2 seconds.\n\nCorollary worth keeping: the sidecar model is *better* than the repo-resident\nmodel for cross-project memory. A brain that lives in its own repo and is cloned\ninto whatever sandbox needs it accumulates lessons across every project, instead\nof one silo per repo.\n\nRelated: [[Kiro Web Capability Matrix]], [[Git Is The Disk]], [[Steering as Boot Loader]]\n", "links": ["Git Is The Disk", "Kiro Web Capability Matrix", "Steering as Boot Loader"]}, {"name": "Git Is The Disk", "body": "---\ncreated: 2026-08-19\ntags: [kiro, persistence]\n---\n\n# Git Is The Disk\n\nKiro Web's documented sandbox lifecycle is: provision \u2192 clone repos \u2192 configure \u2192\nexecute \u2192 **tear down**. Elsewhere the docs say a session's file state persists in\nthe cloud. Those two statements are never reconciled, and sessions are deleted\nafter 90 days regardless.\n\nSo the safe model, and the one this OS is built on: **the sandbox filesystem is a\nscratch disk, and the git remote is storage.** A thought that isn't pushed didn't\nhappen.\n\nPractical consequences:\n\n- `bin/os save` is part of the workflow, not a chore at the end. It runs after\n  every durable decision.\n- The vault lives *inside the repo* (`brain/`), not in a home directory or a\n  config folder outside the clone. Anything outside the clone is presumed lost.\n- Commit granularity is the memory granularity: `git log brain/` is a legible\n  history of what the agent learned and when. `git blame brain/lessons.md` shows\n  when a lesson was learned and which session learned it.\n- This is also the sync mechanism for humans: clone the repo locally, open\n  `brain/` in Obsidian, and the Obsidian Git plugin round-trips edits back.\n\nThe upside of the constraint: memory is diffable, reviewable in a PR, and\nrevertable. A `brain/` change can be rejected in code review \u2014 which is a\nproperty no vector store has.\n\nRelated: [[Kiro Web Capability Matrix]], [[Grep Beats Embeddings Here]]\n", "links": ["Grep Beats Embeddings Here", "Kiro Web Capability Matrix"]}, {"name": "Grep Beats Embeddings Here", "body": "---\ncreated: 2026-08-19\ntags: [memory, retrieval]\n---\n\n# Grep Beats Embeddings Here\n\nRetrieval over this vault is `rg`, not a vector database. Not because semantic\nsearch is bad, but because at this scale the ranking gain doesn't pay for the\nmachinery.\n\nWhat a vector store would add: an embedding service, an index that must be\nrebuilt when notes change, a similarity threshold to tune, a process to run, and\na silent failure mode where the index is stale and recall quietly degrades.\n\nWhat grep costs: nothing. It is exact, instant on thousands of files, and its\nfailure mode is honest \u2014 zero hits means zero hits.\n\nThe structure does the work that embeddings would otherwise do:\n\n- `STATE.md` is a hot cache \u2014 the highest-value context is already loaded, so most\n  queries never need retrieval at all.\n- `[[wikilinks]]` are a hand-built relevance graph. Following links from one hit\n  finds the neighbours a similarity search would surface.\n- Atomic notes with descriptive filenames make filename matching a decent first\n  pass on its own.\n\nWhen to revisit: a vault in the thousands of notes where you routinely search for\na *concept* you can't name a keyword for. Then add semantic search as a second\npass over grep, keeping markdown as the source of truth so the index stays\ndisposable.\n\nRelated: [[Git Is The Disk]], [[Kiro Web Capability Matrix]]\n", "links": ["Git Is The Disk", "Kiro Web Capability Matrix", "wikilinks"]}, {"name": "Kiro Web Capability Matrix", "body": "---\ncreated: 2026-08-19\ntags: [kiro, constraints]\n---\n\n# Kiro Web Capability Matrix\n\nKiro Web runs the same agent harness as the IDE and CLI, but only a subset of the\nconfig surface loads \u2014 which dictates the entire design of this OS.\n\n| Primitive | Kiro Web | Notes |\n|---|---|---|\n| `.kiro/steering/*.md` | \u2705 | all four inclusion modes; arrives with the repo clone |\n| `.kiro/skills/*/SKILL.md` | \u2705 | activation works; slash-commands and import \"coming soon\" |\n| `.kiro/specs/*/` | \u2705 | wave-based parallel task execution, resumable |\n| bash + runtimes + internet | \u2705 | Python, Node, Go, Rust, etc.; open internet |\n| built-in subagents | \u2705 | context-gathering and general-purpose only |\n| `.kiro/hooks/*.json` | \u274c | every trigger unsupported on Web |\n| `.kiro/agents/*.json` | \u274c | built-in agents only |\n| repo `.kiro/settings/mcp.json` | \u274c | configure MCP in Settings \u2192 Agent instead |\n| `~/.kiro/` global scope | \u274c | no local filesystem; use Cloud configuration |\n\nThe consequences that matter:\n\n1. **No `SessionStart` hook** \u2192 the boot sequence cannot be automated by the\n   platform. An `inclusion: always` steering file is the substitute; it is\n   re-read every turn, which makes it more compaction-proof than a hook anyway.\n   See [[Steering as Boot Loader]].\n2. **No custom agents** \u2192 no per-role tool restrictions or model routing on Web.\n   Roles have to be skills the one agent loads, not separate agents.\n3. **Sandbox is per-task and torn down** \u2192 [[Git Is The Disk]].\n4. **Cloud configuration** (Settings \u2192 Cloud configuration) syncs personal\n   steering and skills into every web sandbox, which is how the kernel follows\n   you into repos that don't contain it.\n\nRelated: [[Steering as Boot Loader]], [[Git Is The Disk]], [[Ralph Loop]]\n", "links": ["Git Is The Disk", "Ralph Loop", "Steering as Boot Loader"]}, {"name": "Ralph Loop", "body": "---\ncreated: 2026-08-19\ntags: [loops, pattern]\n---\n\n# Ralph Loop\n\nGeoffrey Huntley's pattern, named after Ralph Wiggum: put a coding agent in a\n`while true` loop that re-reads the *same* prompt file every iteration, and let\nthe filesystem and git carry memory between runs. Each iteration starts with a\nclean context window.\n\nWhy it works: agent quality degrades as context fills. Rather than fighting that\nwith bigger windows or clever orchestration, you externalize state and reset\nruthlessly. The plan file, the todo list, and the git history are the memory;\nthe transcript is disposable.\n\nAdapting it to Kiro Web, where the agent cannot re-invoke itself: **the ledger is\nthe loop counter and the session is the loop body.** `brain/loops/<name>.md` holds\nthe fixed goal, the exit condition, and the checkbox steps. One iteration = read\n`bin/os loop next`, do exactly that step, append findings, tick it, save, stop. A\nlater session \u2014 possibly on another device \u2014 resumes with no re-explaining.\n\nTwo rules that keep it from degenerating:\n\n1. **Steps must be externally verifiable.** \"Fix auth\" is not a step. \"Extract\n   `verifyToken` into `src/auth/token.ts`, tests still pass\" is. Unverifiable\n   steps get ticked optimistically and the loop drifts.\n2. **Two identical failures ends the loop.** Write the blocker into Notes and\n   escalate. Persistence past that point is just expensive hallucination.\n\nDeterministic work still belongs in a real shell loop \u2014 `until npm test; do ...`\n\u2014 because bash repeats for free and doesn't need judgement.\n\nRelated: [[Kiro Web Capability Matrix]], [[Git Is The Disk]]\n", "links": ["Git Is The Disk", "Kiro Web Capability Matrix"]}, {"name": "Steering as Boot Loader", "body": "---\ncreated: 2026-08-19\ntags: [kiro, pattern]\n---\n\n# Steering as Boot Loader\n\nA steering file with `inclusion: always` is injected into context on every\ninteraction. That makes it the closest thing Kiro Web has to a `SessionStart`\nhook \u2014 and in one respect it is strictly better.\n\nA hook fires once, at session start. Its output sits in the transcript and can be\ndropped by context compaction on a long session. An always-included steering file\nis re-supplied every turn, so the boot rule survives compaction, `/compact`, and\na session resumed on another device.\n\nThe pattern: keep the kernel file **small and imperative**. It should not contain\nknowledge \u2014 it contains the instruction to go get knowledge:\n\n```markdown\n---\ninclusion: always\n---\nRun `bash bin/os boot` as the first tool call of every session.\nRun `bash bin/os save \"<summary>\"` as the last.\n```\n\nKnowledge lives behind one deterministic command. That keeps the always-on token\ncost near zero while giving the agent a full memory load in a single tool call \u2014\nprogressive disclosure applied to memory rather than to skills.\n\nFallback ladder for other surfaces: IDE and CLI *do* support hooks, so ship a\n`SessionStart` hook that runs the same `bin/os boot` (stdout on exit 0 is\ninjected into context). Same entry point, two loaders, no duplicated logic.\n\nRelated: [[Kiro Web Capability Matrix]], [[Git Is The Disk]]\n", "links": ["Git Is The Disk", "Kiro Web Capability Matrix"]}], "decisions": [{"name": "2026-08-19 Steering as the boot loader", "body": "---\ndate: 2026-08-19\nstatus: accepted\n---\n\n# Steering as the boot loader\n\n## Context\nThe OS needs a deterministic boot on every session: load working memory, open\nloops, and lessons before doing any work. On Kiro IDE and CLI this is a\n`SessionStart` hook, whose stdout is injected into context on exit 0. On Kiro Web\nhooks do not run at all.\n\n## Decision\nPut the boot instruction in `.kiro/steering/00-kernel.md` with\n`inclusion: always`, pointing at a single command (`bash bin/os boot`). Ship the\nequivalent `SessionStart` hook in `.kiro/hooks/` for IDE and CLI users, calling\nthe same script. One entry point, two loaders.\n\n## Tradeoff\nWhat this costs us: the boot is *instructed*, not *enforced*. A sufficiently\ndistracted agent can skip it, where a hook is mechanical. Accepted because the\nalternative on Web is no boot at all, and because an always-included steering\nfile has a compensating advantage \u2014 it is re-supplied every turn, so it survives\ncontext compaction that would drop a hook's one-time output.\n\n## Alternatives rejected\n- **Hook only** \u2014 silently does nothing on Web, which is the primary surface here.\n- **Inline the memory into steering** \u2014 puts the entire vault in the context\n  window every turn. Defeats the layering and scales terribly.\n- **A custom agent with `resources`** \u2014 custom agents are unavailable on Web.\n"}]}</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const md = s => marked.parse((s||'').replace(/^---[\s\S]*?\n---\n/, '')
  .replace(/\[\[([^\]|]+)\]\]/g, (_,n)=>`<span class="wl" data-go="${n}">${n}</span>`));
document.getElementById('meta').textContent =
  `generated ${D.generated} · ${D.notes.length} notes · ${D.decisions.length} decisions · ` +
  `${D.loops.filter(l=>l.status==='open').length} open loops`;

const views = {
  Overview(){
    const open = D.loops.filter(l=>l.status==='open');
    return card('WORKING MEMORY', md(D.state))
      + (open.length ? open.map(loopCard).join('') : card('LOOPS','<p class="dim">no open loops</p>'))
      + card('LESSONS', md(D.lessons))
      + (D.journal[0] ? card('LATEST JOURNAL — '+D.journal[0].name, md(D.journal[0].body)) : '');
  },
  Loops(){ return D.loops.length ? D.loops.map(loopCard).join('') : '<p class="dim">no loops</p>'; },
  Notes(){
    return `<div class="card"><input id="q" placeholder="filter notes…" size="30"></div>`
      + `<div id="notes">` + D.notes.map(n =>
        `<div class="card note" data-n="${n.name.toLowerCase()}" id="n-${cssid(n.name)}">
           <h3>${n.name}</h3>${md(n.body)}
           ${n.links.length?`<p class="dim">links: ${n.links.map(l=>`<span class="wl" data-go="${l}">${l}</span>`).join(', ')}</p>`:''}
         </div>`).join('') + `</div>`;
  },
  Decisions(){ return D.decisions.map(d=>card(d.name, md(d.body))).join('') || '<p class="dim">none</p>'; },
  Journal(){ return D.journal.map(j=>`<details class="card" open><summary>${j.name}</summary>${md(j.body)}</details>`).join('') || '<p class="dim">none</p>'; },
};
function card(t,b){ return `<div class="card"><h3>${t}</h3>${b}</div>`; }
function cssid(s){ return s.replace(/[^a-z0-9]/gi,'-').toLowerCase(); }
function loopCard(l){
  const done = l.steps.filter(s=>s[0]).length, pct = l.steps.length ? done/l.steps.length*100 : 0;
  return `<div class="card"><h3>LOOP · ${l.name} <span class="dim">${l.status} · ${done}/${l.steps.length}</span></h3>
    <div class="bar"><i style="width:${pct}%"></i></div>${md(l.body)}</div>`;
}
let cur = 'Overview';
function render(){
  document.getElementById('nav').innerHTML = Object.keys(views)
    .map(k=>`<button class="${k===cur?'on':''}" data-v="${k}">${k}</button>`).join('');
  document.getElementById('app').innerHTML = views[cur]();
}
document.addEventListener('click', e => {
  const v = e.target.dataset.v, go = e.target.dataset.go;
  if (v) { cur = v; render(); }
  if (go) { cur = 'Notes'; render();
    const el = document.getElementById('n-'+cssid(go));
    el ? el.scrollIntoView({behavior:'smooth'}) : alert('No note yet: '+go); }
});
document.addEventListener('input', e => {
  if (e.target.id !== 'q') return;
  const q = e.target.value.toLowerCase();
  document.querySelectorAll('.note').forEach(n =>
    n.classList.toggle('hide', !n.dataset.n.includes(q)));
});
render();
</script>
