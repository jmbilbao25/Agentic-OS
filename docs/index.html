<script id="data" type="application/json">{"generated": "2026-08-29 02:36Z", "state": "---\nupdated: 2026-08-29\n---\n\n# Working memory\n\nLoaded on every boot. Hard ceiling ~60 lines \u2014 prune, don't append.\n\n## Current focus\nAgentOS is now **harness-agnostic**: kernel in `AGENTS.md`, portable config in\n`config/`, per-vendor bindings generated by `adapters/install.sh`. Shipping a\nvisual second brain on an always-on server with hybrid search and a web UI.\n\n## Active loops\n- `deploy-always-on` \u2014 put the vault + UI on a `t3.micro`, reachable over TLS\n- `harden-agentos` \u2014 prove each subsystem survives a real session boundary\n\n## Vault layers\n`brain/raw/` capture \u2192 `brain/wiki/` atomic knowledge \u2192 `brain/output/` artifacts.\nPromote by rewriting, never by moving. Supporting: `STATE.md`, `lessons.md`,\n`journal/` (append-only), `decisions/`, `loops/`.\n\n## Environment facts\n- Sandboxes are ephemeral; **git is the only durable layer**. Push or lose it.\n- Never assume a harness supports hooks, cron, daemons, or global config \u2014\n  audit it. See [[Harness Capability Matrix]].\n- A kernel is only as persistent as its delivery. See [[Binding Beats Building]].\n- Model access is not transferable between vendors; keep the provider behind one\n  env var. See [[Model Access Is Not Transferable]].\n\n## The stack on the server\n- Host: EC2 `t3.micro` + 30 GB gp3, ~$10/mo, inside the credit-based free tier.\n- Retrieval: SQLite FTS5 (BM25) + sqlite-vec, fused with RRF. Index is\n  disposable; markdown is truth. See [[Grep Beats Embeddings Here]].\n- Embeddings: quantised MiniLM, CPU-only, on-box. Inference: remote,\n  OpenAI-compatible, currently OpenRouter free tier.\n- Auth: Google OAuth, single-account allowlist. TLS via Tailscale Funnel.\n- Why a server at all: [[Local Runtime Closes The Gaps]].\n\n## Blocked on the user\n- Create the Google OAuth client (console \u2192 credentials) and paste ID + secret\n  into `server/.env`. Nothing else can gate the UI until then.\n- Run `deploy/launch-ec2.sh` from CloudShell, then `deploy/provision.sh` on the box.\n- Install `config/kernel-global.md` at the harness's global scope so repo-less\n  sessions still boot.\n\n## Recent decisions\n- [[2026-08-19 Steering as the boot loader]] \u2014 an always-included kernel file\n  carries the boot instruction; hooks are an upgrade, not a requirement.\n- Hybrid retrieval for humans and RAG, grep for the agent. Markdown stays\n  authoritative \u2014 the reconciliation is in [[Grep Beats Embeddings Here]].\n\n## Next action\n`bin/os loop next deploy-always-on`\n", "lessons": "---\nupdated: 2026-08-29\n---\n\n# Lessons\n\nActivation-based: each line names the situation that should fire it. A lesson\nwithout a trigger is a note. Wrong lessons get deleted, not archived.\n\n- When starting any session in this repo \u2192 run `bash bin/os boot` before replying. Because the sandbox starts with no memory of the last session. _(2026-08-19)_\n- When a session produces a decision, lesson, or finished step \u2192 `bin/os save` immediately. Because sandbox teardown discards uncommitted work silently. _(2026-08-19)_\n- When work will outlive one context window \u2192 create a loop ledger instead of trusting the transcript. Because context compaction drops the middle of long sessions. _(2026-08-19)_\n- When about to rely on a harness feature (hooks, custom agents, repo-level MCP, global config) \u2192 verify it actually loads in *this* surface first. Because unsupported config fails silently rather than erroring, and you will debug the wrong layer for an hour. _(2026-08-19)_\n- When about to add a note that overlaps an existing one \u2192 rewrite the existing note instead. Because two notes disagreeing is worse than one note being stale. _(2026-08-19)_\n- When `gh pr create` or any `gh pr`/`gh issue` subcommand is tempting \u2192 use `gh api` REST instead. Because the GraphQL-backed subcommands always fail in this sandbox. _(2026-08-19)_\n- When the same loop step fails twice \u2192 stop, write the blocker into the ledger's Notes, escalate. Because a third identical attempt produces confident garbage. _(2026-08-19)_\n- When verifying a generated UI \u2192 load it headless and assert on the DOM, don't assume it renders. Because a template typo produces a blank page that looks fine in source. _(2026-08-19)_\n- When a session starts with an empty workspace or no repo bound \u2192 the brain is not missing, it is uncloned; run the sidecar clone from the global kernel before claiming no context exists. Because repo-resident config cannot load in a session bound to no repo. _(2026-08-19)_\n- When the brain needs to be reachable from any session \u2192 keep it in its own repo on the default branch, cloned by the global kernel to a fixed path. Because hosted harnesses clone only the default branch and offer no branch picker. _(2026-08-19)_\n- When the user wants an agent that is persistent like a real OS (daemon, scheduler, survives reboot) \u2192 that is a machine they control, not a hosted sandbox. Because hosted surfaces have no cron and tear the sandbox down per task. _(2026-08-19)_\n- When asked to run one vendor's models through another vendor's agent CLI \u2192 say no and explain the boundary. Because agent CLIs authenticate only against their own subscription, their own API key, or a cloud reseller, and vendor terms forbid third parties exposing consumer logins. _(2026-08-19)_\n- When writing the kernel \u2192 put it in a neutral file (`AGENTS.md`) and generate per-vendor bindings from it. Because a kernel written directly into one vendor's config path binds the OS to that vendor, which is the same mistake as binding it to one repo. _(2026-08-29)_\n- When adding semantic search to a markdown vault \u2192 keep markdown authoritative and treat the index as disposable, rebuildable from source. Because state you cannot diff or review in a PR stops being memory and becomes a dependency. _(2026-08-29)_\n- When sizing a box to host a vault plus a search index \u2192 a `t3.micro` is enough, provided inference stays remote. Because the index and a quantised embedding model are small; only the LLM is heavy, and it does not need to live with the data. _(2026-08-29)_\n- When a note's own stated revisit-condition comes true \u2192 rewrite that note with the reconciliation, keeping the filename. Because the honest record of \"we said X, then X's exit condition fired\" is more valuable than either a stale note or a silent overwrite. _(2026-08-29)_\n- When an integration seems to need a paid subscription \u2192 check whether the software and the inference are separately licensed. Because open-source agents are usually free while the model calls behind them are not, and conflating the two leads to paying for the wrong thing. _(2026-08-29)_\n", "loops": [{"name": "deploy-always-on", "status": "open", "steps": [[false, "launch the instance \u2014 `deploy/launch-ec2.sh` from CloudShell (t3.micro, 30 GB gp3, SG allows only 22 in)"], [false, "`deploy/provision.sh` on the box \u2014 swap, python venv, deps, clone, systemd units"], [false, "create the Google OAuth client, put ID + secret + `OPENROUTER_API_KEY` in `server/.env`"], [false, "`tailscale up` then `tailscale funnel 8000` \u2014 confirm the public HTTPS hostname resolves"], [false, "set `OAUTH_REDIRECT_URI` to the funnel hostname, restart, complete one real Google login"], [false, "confirm a second Google account is rejected with 403 (this is the security test, not a formality)"], [false, "`agentos-index` once \u2014 confirm FTS5 + vector row counts match the file count"], [false, "load the orbit UI in a browser, search with `/`, open a note, confirm the preview renders"], [false, "ask one RAG question, verify every citation points at a file that actually exists"], [false, "enable the `agentos-sync.timer`, wait for one unattended run, confirm git pull + reindex in the log"], [false, "`sudo reboot`, then re-run the `check` command with no manual intervention"], [false, "set a billing alarm at $20/mo and record the real observed cost in Notes"]], "body": "---\nloop: deploy-always-on\nstatus: open\ncheck: curl -fsS https://$AGENTOS_HOST/healthz\ncreated: 2026-08-19\nupdated: 2026-08-29\n---\n\n# Goal\nMove AgentOS off ephemeral sandboxes and onto an always-on machine the user controls,\nwhere an agentic OS can actually be persistent: a daemon that survives reboot, a\nscheduler that fires with the laptop shut, hybrid search over the whole vault, and a\nweb UI reachable from anywhere behind a login. Host is an EC2 `t3.micro` inside the\ncredit-based free tier. The `brain/` vault stays the git-versioned, Obsidian-readable\nsource of truth; everything on the box is a disposable index in front of it.\n\n# Done when\n`https://<host>/healthz` returns 200 over real TLS; Google OAuth admits exactly one\naccount and rejects everything else; the orbit UI renders the live vault; a RAG answer\ncites real note paths; a `systemd` timer has pulled from git and reindexed unattended\nat least once; and the whole thing comes back by itself after `sudo reboot`.\n\n# Steps\n- [ ] launch the instance \u2014 `deploy/launch-ec2.sh` from CloudShell (t3.micro, 30 GB gp3, SG allows only 22 in)\n- [ ] `deploy/provision.sh` on the box \u2014 swap, python venv, deps, clone, systemd units\n- [ ] create the Google OAuth client, put ID + secret + `OPENROUTER_API_KEY` in `server/.env`\n- [ ] `tailscale up` then `tailscale funnel 8000` \u2014 confirm the public HTTPS hostname resolves\n- [ ] set `OAUTH_REDIRECT_URI` to the funnel hostname, restart, complete one real Google login\n- [ ] confirm a second Google account is rejected with 403 (this is the security test, not a formality)\n- [ ] `agentos-index` once \u2014 confirm FTS5 + vector row counts match the file count\n- [ ] load the orbit UI in a browser, search with `/`, open a note, confirm the preview renders\n- [ ] ask one RAG question, verify every citation points at a file that actually exists\n- [ ] enable the `agentos-sync.timer`, wait for one unattended run, confirm git pull + reindex in the log\n- [ ] `sudo reboot`, then re-run the `check` command with no manual intervention\n- [ ] set a billing alarm at $20/mo and record the real observed cost in Notes\n\n# Notes\n- Inference stays **remote** on purpose. A box that can hold a useful model costs ~10x a\n  box that can hold an index, and is worse. Only the embedding model is local\n  (quantised MiniLM, CPU, ~90 MB). See [[Local Runtime Closes The Gaps]].\n- Free tier here is **credit-based** ($100-class credit with an expiry), not the old\n  always-free instance-hours. So cost is credit burn: t3.micro + 30 GB gp3 \u2248 $10/mo.\n  A t3.small doubles compute and halves the runway \u2014 not worth it for an index.\n- 1 GB RAM is the real constraint. Hence SQLite FTS5 + sqlite-vec (no daemon) rather\n  than Postgres + pgvector, and ONNX int8 rather than PyTorch. 2 GB swap for reindex\n  headroom.\n- Tailscale Funnel gives a real Let's Encrypt cert on a stable `*.ts.net` hostname with\n  no domain purchase and no port 443 exposed to the world. The alternative (DuckDNS +\n  Caddy DNS-01) also works and is documented in `deploy/README.md`.\n- Security rule: the SG opens **22 only**. The app is never bound to a public interface\n  directly \u2014 Funnel terminates TLS and forwards to localhost. An OAuth app with a\n  single-email allowlist behind a plain-HTTP port is not protected, it is decorated.\n- Do not delete anything from `brain/` because the index can answer faster. The index is\n  a cache; deleting the markdown trades an auditable artifact for a database you cannot\n  diff. See [[Git Is The Disk]].\n"}, {"name": "harden-agentos", "status": "open", "steps": [[true, "scaffold kernel, skills, vault, `bin/os`, dashboard"], [true, "verify `boot`, `selftest`, and `dash` run clean in this sandbox"], [true, "push to a remote and confirm `save` round-trips (this is the durability test)"], [false, "open a fresh session on this repo, boot cold, confirm context loads"], [false, "clone locally, open `brain/` in Obsidian, confirm graph and links resolve"], [false, "boot on a second harness via `adapters/install.sh` \u2014 confirm the kernel loads unmodified"], [false, "enable GitHub Pages on `docs/` and confirm the dashboard renders"], [false, "run one non-trivial task end to end using only loop + save discipline"], [false, "prune whatever turned out to be dead weight \u2014 deletion is a step too"]], "body": "---\nloop: harden-agentos\nstatus: open\ncheck: bash bin/os selftest\ncreated: 2026-08-19\n---\n\n# Goal\nProve every AgentOS subsystem actually survives a real session boundary, on any\nharness, and fix whatever doesn't. The claim under test: a fresh session with zero\nconversation history can reconstruct full working context from `bin/os boot`\nalone, and hand it back off cleanly.\n\n# Done when\n`bash bin/os selftest` passes, and a brand-new session \u2014 no prior transcript \u2014\ncorrectly answers \"what were we doing and what's next?\" using only the boot\noutput, then advances one step of this loop and pushes it.\n\n# Steps\n- [x] scaffold kernel, skills, vault, `bin/os`, dashboard\n- [x] verify `boot`, `selftest`, and `dash` run clean in this sandbox\n- [x] push to a remote and confirm `save` round-trips (this is the durability test)\n- [ ] open a fresh session on this repo, boot cold, confirm context loads\n- [ ] clone locally, open `brain/` in Obsidian, confirm graph and links resolve\n- [ ] boot on a second harness via `adapters/install.sh` \u2014 confirm the kernel loads unmodified\n- [ ] enable GitHub Pages on `docs/` and confirm the dashboard renders\n- [ ] run one non-trivial task end to end using only loop + save discipline\n- [ ] prune whatever turned out to be dead weight \u2014 deletion is a step too\n\n# Notes\n- 2026-08-19: `boot` output is ~40 lines with a seeded vault. Watch that number as\n  the journal grows; boot prints only the last two entries for that reason.\n- Durability is the one property that cannot be verified inside a single session.\n  Steps 3 and 4 are the real test; everything before them is scaffolding.\n- 2026-08-19: `bin/os save` round-trip confirmed against origin/agentos. Repo creation via the sandbox gateway is blocked (403 REST, GraphQL passthrough refused), so AgentOS ships as a branch/PR on an existing repo.\n- 2026-08-19: step 4 first attempt FAILED \u2014 session had no repo bound, so nothing cloned. Root cause and fix in [[Binding Beats Building]]. Sidecar clone+boot verified from an empty workspace; the remaining half of step 4 is a fresh session *with the global kernel installed*.\n- 2026-08-19: I ticked step 4 without doing it. Unticked. Step 4 requires a fresh session on the user side; no in-session evidence can satisfy it. What IS verified: the exact global-kernel boot command works from an empty workspace against the new repo.\n- 2026-08-29: added a cross-harness step. The kernel now lives in `AGENTS.md` with generated bindings, so \"does it boot somewhere else\" became a testable claim rather than an aspiration. `selftest` gained a drift check that fails if a binding no longer matches the kernel.\n"}], "journal": [{"name": "2026-08-29", "body": "---\ndate: 2026-08-29\n---\n\n# 2026-08-29\n\n- 02:36Z \u2014 Made AgentOS harness-agnostic: kernel moved to AGENTS.md, per-vendor bindings generated by adapters/install.sh (claude, kiro, cursor, copilot, windsurf, gemini, agents.md), cloud-config -> config/. selftest gained a binding-drift check.\n- 02:36Z \u2014 Vault restructured into raw -> wiki -> output layers with bin/os capture and bin/os ship as entry points. Renamed the three vendor-named notes and rewrote every inbound wikilink; journal left untouched because it is append-only.\n- 02:36Z \u2014 Built server/: FastAPI + hybrid retrieval (SQLite FTS5/BM25 + sqlite-vec, weighted RRF), local quantised BGE embeddings, Google OAuth with a single-email allowlist, and an interactive ARMS orbit UI with no framework or CDN.\n- 02:36Z \u2014 Measured retrieval instead of assuming it. Found three real bugs: fastembed query_embed is a no-op for bge-small (cosine 1.0000 vs embed) so the BGE instruction prefix is now applied explicitly; FTS5's porter tokenizer keeps stopwords, which buried 'Git Is The Disk' under its own title words; unweighted RRF scored worse than semantic alone on a small corpus. Tuned to RRF_K=20 / W_SEMANTIC=2.0 \u2014 hybrid now beats both halves on top-5 (9/10).\n- 02:36Z \u2014 Verified the UI by screenshotting it headless rather than trusting the source. Caught the canvas being measured before layout, which had rendered the whole map into a 300x150 corner, plus faint ring bands, a label pile-up, and a banner covering a ring label.\n- 02:36Z \u2014 Wrote deploy/ for a t3.micro (~$10/mo): swap, venv, systemd unit with MemoryMax, a 15-minute pull+reindex timer, and Tailscale Funnel for real TLS with no domain purchase and no inbound port.\n", "fm": {"date": "2026-08-29"}, "links": []}, {"name": "2026-08-19", "body": "---\ndate: 2026-08-19\n---\n\n# 2026-08-19\n\n- Researched whether a persistent agentic OS can run inside Kiro. Answer: yes, but\n  only on the primitives Web actually loads \u2014 steering, skills, specs, bash, git.\n- Established the binding constraints. Hooks, custom agents, and repo `mcp.json`\n  are unavailable on Kiro Web; the sandbox is torn down per task. Recorded in\n  [[Kiro Web Capability Matrix]] and [[Git Is The Disk]].\n- Chose `inclusion: always` steering as the boot loader instead of a\n  `SessionStart` hook. Decision and tradeoff written up.\n- Built the runtime: `bin/os` (boot/log/lesson/note/decide/recall/loop/dash/save/\n  selftest), `bin/osutil.py` for parsing and the dashboard, seeded `brain/`.\n- Adapted the Ralph loop to a surface where the agent can't re-invoke itself: the\n  ledger is the loop counter, the session is the loop body. See [[Ralph Loop]].\n- Skipped a vector store. Grep plus a hot `STATE.md` covers retrieval at this\n  scale; reasoning in [[Grep Beats Embeddings Here]].\n- 13:24Z \u2014 pushed to origin/agentos and opened PR #11; dashboard verified rendering in a headless browser (5 notes, 25 wikilinks, tab nav and filter all work)\n- 13:44Z \u2014 cold-boot test failed for a binding reason, not a design one: session had no repo selected, and main has no .kiro since PR #11 is unmerged. Added a self-bootstrapping global kernel for Settings -> Cloud configuration; verified clone+boot from a fully empty workspace.\n- 13:52Z \u2014 migrated the brain from test-repo/agentos into its own private repo jmbilbao25/Agentic-OS on main; global kernel now clones to /projects/sandbox/Agentic-OS with no branch flag\n- 14:03Z \u2014 clarified cloud config: UI takes one .kiro-type folder at a time, name-identified. Restructured so cloud-config/{steering,skills} hold the real files and .kiro/ symlinks into them - one source of truth. Added Android upload path since the phone picker blocks Download/ and storage root.\n- 14:15Z \u2014 researched and TESTED the local path: installed Claude Code (v2.1.235, refuses without Anthropic auth) and Kiro Crew (0.2.0, doctor clean, provider=acp via kiro-cli). Crew closes every gap Web could not: cron, service install, spawn, run <spec>, six-layer memory with FAISS, dashboard, snapshot/restore. Opened the go-local loop.\n", "fm": {"date": "2026-08-19"}, "links": ["Git Is The Disk", "Grep Beats Embeddings Here", "Kiro Web Capability Matrix", "Ralph Loop"]}], "notes": [{"name": "Binding Beats Building", "body": "---\ncreated: 2026-08-19\nupdated: 2026-08-29\ntags: [constraints, postmortem, portability]\n---\n\n# Binding Beats Building\n\nFirst cold-boot test failed. A fresh session asked \"what are we doing?\" and answered\n\"nothing \u2014 empty workspace, no prior context.\" The OS was fine. The session was never\nbound to anything containing it.\n\nTwo independent causes, both about delivery rather than design:\n\n1. **No repo selected.** Hosted harnesses clone repos server-side at session creation.\n   No repo \u2192 no clone \u2192 no kernel file \u2192 no boot. A kernel cannot bootstrap itself from\n   a repo it was never given.\n2. **Wrong branch even if selected.** Hosted harnesses typically clone the *default*\n   branch and offer no branch picker. The OS lived on an unmerged branch, so the default\n   branch had no kernel at all. A repo-bound session would still have booted empty.\n\nThe general lesson: **a config-file OS is only as persistent as its delivery mechanism.**\nA kernel-in-the-repo gives you persistence *within a bound repo*; it gives you nothing in\na session bound to nothing. Those are different guarantees and they are easy to conflate.\n\nThe fix is a second kernel at a scope **above** the repo \u2014 the harness's user/global\nconfig slot, which is injected into every session regardless of what was cloned. That\nkernel has to be **self-bootstrapping**: it cannot reference `bin/os`, because in a\nrepo-less sandbox no such file exists yet. So it carries the clone command itself and\ntreats the brain as a sidecar repo with its own remote. That file is\n`config/kernel-global.md`.\n\nVerified: from a completely empty workspace, a shallow clone of the brain followed by\n`bin/os boot` reconstructs full working memory. One command, no repo binding, ~2 seconds.\n\nCorollary worth keeping: the sidecar model is *better* than the repo-resident model for\ncross-project memory. A brain that lives in its own repo and is cloned into whatever\nsandbox needs it accumulates lessons across every project, instead of one silo per repo.\n\nSecond corollary, learned later: the same argument applies across *harnesses*, not just\nrepos. A kernel written for one vendor's config path is bound to that vendor. Keeping the\nkernel in a neutral file and generating the vendor-specific bindings from it \u2014 see\n`adapters/` \u2014 is the same \"binding beats building\" insight applied one level up.\n\nRelated: [[Harness Capability Matrix]], [[Git Is The Disk]], [[Steering as Boot Loader]]\n", "fm": {"created": "2026-08-19", "updated": "2026-08-29", "tags": "[constraints, postmortem, portability]"}, "links": ["Git Is The Disk", "Harness Capability Matrix", "Steering as Boot Loader"]}, {"name": "Git Is The Disk", "body": "---\ncreated: 2026-08-19\nupdated: 2026-08-29\ntags: [persistence, portability]\n---\n\n# Git Is The Disk\n\nThe documented sandbox lifecycle for hosted agent harnesses is: provision \u2192 clone repos\n\u2192 configure \u2192 execute \u2192 **tear down**. Elsewhere the same docs usually claim a session's\nfile state persists in the cloud. Those two statements are never reconciled, and sessions\nget deleted on a timer regardless.\n\nSo the safe model, and the one this OS is built on: **the sandbox filesystem is a scratch\ndisk, and the git remote is storage.** A thought that isn't pushed didn't happen.\n\nPractical consequences:\n\n- `bin/os save` is part of the workflow, not a chore at the end. It runs after every\n  durable decision.\n- The vault lives *inside the repo* (`brain/`), not in a home directory or a config folder\n  outside the clone. Anything outside the clone is presumed lost.\n- Commit granularity is memory granularity: `git log brain/` is a legible history of what\n  the agent learned and when. `git blame brain/lessons.md` shows when a lesson was learned\n  and which session learned it.\n- This is also the sync mechanism for humans: clone the repo, open `brain/` in Obsidian,\n  and the Obsidian Git plugin round-trips edits back.\n\nThe upside of the constraint: memory is diffable, reviewable in a PR, and revertable. A\n`brain/` change can be rejected in code review \u2014 a property no vector store has.\n\n## This is also the portability argument\n\nGit as the disk is what makes the OS survive a change of harness, not just a change of\nsession. The vault is markdown; the runtime is one shell script; storage is a protocol\nevery tool on earth speaks. Swap the agent, the model, the vendor, or the machine and the\nmemory is untouched.\n\nAny component that wants to hold state somewhere other than git \u2014 a database, a vendor's\nmemory feature, a vector index \u2014 is welcome to, **as a cache**. The moment it becomes the\nonly copy, you have traded an auditable artifact for a dependency. See\n[[Local Runtime Closes The Gaps]].\n\nRelated: [[Harness Capability Matrix]], [[Grep Beats Embeddings Here]], [[Local Runtime Closes The Gaps]]\n", "fm": {"created": "2026-08-19", "updated": "2026-08-29", "tags": "[persistence, portability]"}, "links": ["Grep Beats Embeddings Here", "Harness Capability Matrix", "Local Runtime Closes The Gaps"]}, {"name": "Grep Beats Embeddings Here", "body": "---\ncreated: 2026-08-19\nupdated: 2026-08-29\ntags: [memory, retrieval]\n---\n\n# Grep Beats Embeddings Here\n\nRetrieval over this vault is keyword-first, and for the *agent* it stays that way. Not\nbecause semantic search is bad, but because at this scale the ranking gain rarely pays\nfor the machinery \u2014 and because grep's failure mode is honest.\n\nWhat a vector-only store adds: an embedding service, an index that must be rebuilt when\nnotes change, a similarity threshold to tune, a process to run, and a silent failure mode\nwhere the index is stale and recall quietly degrades.\n\nWhat grep costs: nothing. It is exact, instant on thousands of files, and zero hits means\nzero hits.\n\nThe structure does the work embeddings would otherwise do:\n\n- `STATE.md` is a hot cache \u2014 the highest-value context is already loaded, so most queries\n  never need retrieval at all.\n- `[[wikilinks]]` are a hand-built relevance graph. Following links from one hit finds the\n  neighbours a similarity search would surface.\n- Atomic notes with descriptive filenames make filename matching a decent first pass.\n\n## Update 2026-08-29: the revisit condition fired\n\nThe original note named its own exit condition \u2014 *\"add semantic search as a second pass\nover grep, keeping markdown as the source of truth so the index stays disposable.\"* Two\nthings triggered it:\n\n1. A **human** browsing a visual second brain searches by half-remembered concept, not by\n   keyword. \"That thing about why memory should be diffable\" has no reliable search term.\n2. A **RAG answer** needs passages ranked across the whole vault, which is exactly the job\n   keyword search is worst at.\n\nSo `server/` now runs **hybrid** retrieval, built to honour the original constraint rather\nthan abandon it:\n\n| Decision | Why it keeps the note's spirit |\n|---|---|\n| SQLite **FTS5 + BM25** for the keyword half | zero new dependency; grep-grade honesty, better ranking |\n| **sqlite-vec** for the vector half | a file, not a service \u2014 no daemon to keep alive |\n| Quantised MiniLM, CPU-only, ~90 MB | runs on a `t3.micro`; no GPU, no API call to embed |\n| **Reciprocal Rank Fusion** to combine them | keyword hits still surface even when embeddings whiff |\n| Index rebuilt from markdown, never authored | the index is disposable; delete it and reindex |\n\nThe load-bearing rule is unchanged and non-negotiable: **markdown is the source of truth\nand the index is a cache.** `bin/os recall` still greps, because an agent mid-task wants a\ndeterministic answer. Semantic search is a *second* pass for humans and for RAG, exactly as\nthis note originally prescribed.\n\nThe distinction worth keeping: **agents recall, humans browse.** Those want different\nretrieval, and it is fine to run both as long as only one of them is authoritative.\n\nRelated: [[Git Is The Disk]], [[Harness Capability Matrix]], [[Local Runtime Closes The Gaps]]\n", "fm": {"created": "2026-08-19", "updated": "2026-08-29", "tags": "[memory, retrieval]"}, "links": ["Git Is The Disk", "Harness Capability Matrix", "Local Runtime Closes The Gaps", "wikilinks"]}, {"name": "Harness Capability Matrix", "body": "---\ncreated: 2026-08-19\nupdated: 2026-08-29\ntags: [constraints, portability]\n---\n\n# Harness Capability Matrix\n\nEvery agent harness loads a *subset* of the config surface it documents, and which\nsubset decides the entire design of an agentic OS. Audit the surface before building\non it, because the failure mode is silent: an unsupported config file does not error,\nit simply never loads.\n\n## The primitives worth auditing\n\nFor any harness, ask which of these actually work \u2014 not which are documented:\n\n| Primitive | Why it matters | Typical answer |\n|---|---|---|\n| always-on instruction file | the boot loader; without it there is no kernel | usually \u2705 |\n| skills / reusable procedures | SOPs as commands instead of re-prompting | often \u2705 |\n| session-start hook | makes boot *enforced* rather than merely instructed | \u2705 local, \u274c hosted |\n| scheduler / cron | routines that fire with the laptop shut | \u274c hosted, \u2705 own machine |\n| long-lived daemon | anything that must survive logout | \u274c hosted, \u2705 own machine |\n| custom sub-agents | per-role tool restrictions and model routing | inconsistent |\n| repo-level MCP config | connectors that travel with the project | inconsistent |\n| user/global config scope | a brain that follows you into any project | inconsistent |\n| shell + internet | the escape hatch that makes everything else recoverable | almost always \u2705 |\n| filesystem durability | whether anything survives the session | **assume \u274c** |\n\n## The two conclusions that generalise\n\n**1. Hosted sandboxes give you instructions, not enforcement.** No hook, no cron, no\ndaemon. So the boot sequence has to live in an always-included instruction file that\nis re-supplied every turn \u2014 which is more compaction-proof than a hook anyway. See\n[[Steering as Boot Loader]].\n\n**2. The filesystem is a scratch disk.** Every hosted harness either tears the\nsandbox down per task or expires sessions on a timer, and the docs are usually\nself-contradictory about which. Treat durability as absent until measured. See\n[[Git Is The Disk]].\n\nTogether those force the same architecture regardless of vendor: **a small imperative\nkernel, a markdown vault, one shell entry point, and git as storage.** Nothing in\nthat list is proprietary, which is why the OS ports in an afternoon when the harness\nchanges.\n\n## Auditing a new harness\n\n1. Write the smallest possible always-on instruction file. Start a session. Did it\n   load? That is your kernel slot.\n2. Try a session hook. If it fires, promote boot from instructed to enforced.\n3. Look for a scheduler. If there isn't one, routines need an always-on machine \u2014\n   see [[Local Runtime Closes The Gaps]].\n4. Write a file outside the repo, end the session, come back. Assume it's gone; you\n   are only checking whether you were pleasantly surprised.\n5. Record the answers here, then delete whatever the harness made redundant.\n\nRelated: [[Steering as Boot Loader]], [[Git Is The Disk]], [[Local Runtime Closes The Gaps]], [[Ralph Loop]]\n", "fm": {"created": "2026-08-19", "updated": "2026-08-29", "tags": "[constraints, portability]"}, "links": ["Git Is The Disk", "Local Runtime Closes The Gaps", "Ralph Loop", "Steering as Boot Loader"]}, {"name": "Local Runtime Closes The Gaps", "body": "---\ncreated: 2026-08-19\nupdated: 2026-08-29\ntags: [runtime, deployment, persistence]\n---\n\n# Local Runtime Closes The Gaps\n\nEvery gap in [[Harness Capability Matrix]] \u2014 no enforced boot, no cron, no daemon, no\ncustom agents \u2014 is a gap in the *hosting*, not in the OS. Move the same vault and the\nsame `bin/os` onto a machine you control and all of them close at once.\n\n## What a machine you control adds\n\n| Missing capability | What provides it |\n|---|---|\n| enforced boot | a real session hook, or a wrapper script around the agent CLI |\n| routines that fire with your laptop shut | `cron` / `systemd` timers |\n| survives logout and restarts on crash | a `systemd` unit |\n| unattended loop advancement | a timer calling `bin/os loop next` |\n| semantic recall over the whole vault | an indexer + a local embedding model |\n| a real UI | a small HTTP server in front of the vault |\n\nNone of that needs a vendor feature. It needs a box with an uptime.\n\n## The two viable hosts\n\n**Your own hardware.** Free, private, and asleep half the time. A laptop that sleeps\nis a poor host for a scheduler, so this works for interactive use and fails for\nroutines.\n\n**A small always-on server.** A `t3.micro`-class instance is enough for the vault, a\nhybrid search index, and a quantised embedding model, because none of those are heavy\n\u2014 the *model inference* is remote. Roughly $10/month, and it is awake at 4am when the\nroutine fires. This is what `deploy/` provisions and what the `deploy-always-on` loop\ntracks.\n\n## Keep the model remote\n\nThe temptation on any server is to run inference locally too. Resist it at small\nsizes: a box that can hold a useful model costs an order of magnitude more than a box\nthat can hold an index, and the quality is worse. Keep inference behind an\nOpenAI-compatible endpoint and treat the provider as swappable \u2014 see\n[[Model Access Is Not Transferable]] for why pinning yourself to one vendor's auth is\nthe thing that actually strands you.\n\nWhat *does* belong on the box: the vault, the search index, the embedding model\n(quantised, ~90 MB, CPU-only), the scheduler, and the web UI.\n\n## Why this doesn't invalidate the vault\n\nThe vault stays the durable, portable, auditable layer. Any runtime with a database\nwill offer you better recall than markdown plus grep, and you should use it \u2014 as an\n*index*, not as the source of truth. State in a database is state you cannot diff,\ncannot review in a PR, and cannot read in five years without the software that wrote\nit. Markdown in git survives the runtime that indexes it.\n\nThe rule: **indexes are disposable, the vault is not.** Anything that inverts that\nrelationship is a trap, however good the retrieval is.\n\nRelated: [[Harness Capability Matrix]], [[Git Is The Disk]], [[Model Access Is Not Transferable]], [[Grep Beats Embeddings Here]]\n", "fm": {"created": "2026-08-19", "updated": "2026-08-29", "tags": "[runtime, deployment, persistence]"}, "links": ["Git Is The Disk", "Grep Beats Embeddings Here", "Harness Capability Matrix", "Model Access Is Not Transferable"]}, {"name": "Model Access Is Not Transferable", "body": "---\ncreated: 2026-08-19\nupdated: 2026-08-29\ntags: [auth, licensing, portability, verified]\n---\n\n# Model Access Is Not Transferable\n\nA subscription to one vendor's agent product does not grant model access to a\ndifferent vendor's agent product, even when both sit on top of the same underlying\nmodel. This is a licensing boundary, not a missing feature, and no amount of config\ngets around it.\n\nVerified the hard way: installing a vendor's coding CLI works fine, and then it asks\nto log in \u2014 and the only credentials it accepts are that vendor's own. A subscription\npurchased elsewhere is not one of them.\n\n## What agent CLIs actually authenticate against\n\nAlmost every one accepts exactly three categories:\n\n1. **That vendor's own subscription**, via OAuth.\n2. **That vendor's own API key**, from their console.\n3. **A cloud reseller** the vendor has a deal with \u2014 Bedrock, Vertex, Foundry.\n\nAn entitlement bought from anyone outside those three is not convertible. Vendor terms\ngenerally *forbid* third parties from exposing their consumer login or rate limits to\nother products, so anything that appears to bridge two ecosystems is either violating\nterms or is a paid gateway quietly reselling tokens at a markup.\n\n## The design consequence\n\nDo not build an OS that assumes a particular provider's auth. Build it so the provider\nis one environment variable.\n\n- Talk to models over the **OpenAI-compatible chat-completions shape**. It is the de\n  facto interop layer; nearly every provider and every local server speaks it.\n- Keep `base_url`, `api_key`, and `model` in config, never in code.\n- Aggregators (OpenRouter and similar) exist precisely to make the provider swappable,\n  and their free tiers are enough to prove a system works before you pay anyone.\n- A local server (`ollama`, `vllm`, `llama.cpp`) is the same shape again, so \"run it\n  offline\" costs a URL change rather than a rewrite.\n\nThat is the whole mitigation. When it is one variable, a licensing wall stops being an\narchitectural problem and becomes a procurement preference.\n\n## The trap to name out loud\n\nWanting *one specific branded tool* is almost always wanting one of its capabilities:\nan agent that remembers, enforced session hooks, or unattended loops. All three are\nobtainable from several tools, and from this repo. Pick by capability, not by the brand\non it \u2014 otherwise you end up paying twice for the same model and calling it\nintegration.\n\nRelated: [[Local Runtime Closes The Gaps]], [[Harness Capability Matrix]]\n", "fm": {"created": "2026-08-19", "updated": "2026-08-29", "tags": "[auth, licensing, portability, verified]"}, "links": ["Harness Capability Matrix", "Local Runtime Closes The Gaps"]}, {"name": "Ralph Loop", "body": "---\ncreated: 2026-08-19\ntags: [loops, pattern]\n---\n\n# Ralph Loop\n\nGeoffrey Huntley's pattern, named after Ralph Wiggum: put a coding agent in a\n`while true` loop that re-reads the *same* prompt file every iteration, and let\nthe filesystem and git carry memory between runs. Each iteration starts with a\nclean context window.\n\nWhy it works: agent quality degrades as context fills. Rather than fighting that\nwith bigger windows or clever orchestration, you externalize state and reset\nruthlessly. The plan file, the todo list, and the git history are the memory;\nthe transcript is disposable.\n\nAdapting it to a hosted harness, where the agent cannot re-invoke itself: **the\nledger is the loop counter and the session is the loop body.** `brain/loops/<name>.md` holds\nthe fixed goal, the exit condition, and the checkbox steps. One iteration = read\n`bin/os loop next`, do exactly that step, append findings, tick it, save, stop. A\nlater session \u2014 possibly on another device \u2014 resumes with no re-explaining.\n\nTwo rules that keep it from degenerating:\n\n1. **Steps must be externally verifiable.** \"Fix auth\" is not a step. \"Extract\n   `verifyToken` into `src/auth/token.ts`, tests still pass\" is. Unverifiable\n   steps get ticked optimistically and the loop drifts.\n2. **Two identical failures ends the loop.** Write the blocker into Notes and\n   escalate. Persistence past that point is just expensive hallucination.\n\nDeterministic work still belongs in a real shell loop \u2014 `until npm test; do ...`\n\u2014 because bash repeats for free and doesn't need judgement.\n\nRelated: [[Harness Capability Matrix]], [[Git Is The Disk]]\n", "fm": {"created": "2026-08-19", "tags": "[loops, pattern]"}, "links": ["Git Is The Disk", "Harness Capability Matrix"]}, {"name": "Steering as Boot Loader", "body": "---\ncreated: 2026-08-19\nupdated: 2026-08-29\ntags: [pattern, portability]\n---\n\n# Steering as Boot Loader\n\nAn always-included instruction file is injected into context on every interaction. That\nmakes it the closest thing a hosted harness has to a session-start hook \u2014 and in one\nrespect it is strictly better.\n\nA hook fires once, at session start. Its output sits in the transcript and can be dropped\nby context compaction on a long session. An always-included instruction file is re-supplied\nevery turn, so the boot rule survives compaction, an explicit `/compact`, and a session\nresumed on another device.\n\nThe pattern: keep the kernel **small and imperative**. It should not contain knowledge \u2014 it\ncontains the instruction to go get knowledge:\n\n```markdown\nRun `bash bin/os boot` as the first tool call of every session.\nRun `bash bin/os save \"<summary>\"` as the last.\n```\n\nKnowledge lives behind one deterministic command. That keeps the always-on token cost near\nzero while giving the agent a full memory load in a single tool call \u2014 progressive\ndisclosure applied to memory rather than to skills.\n\n## The fallback ladder\n\nDifferent surfaces support different loaders. Same entry point for all of them, so there is\nnever duplicated logic:\n\n| Surface | Loader | Boot is |\n|---|---|---|\n| hosted sandbox | always-included instruction file | instructed |\n| local IDE or CLI | session-start hook running `bin/os boot` | enforced |\n| always-on server | `systemd` timer or `cron` | scheduled |\n| any harness at all | the user typing `bin/os boot` | manual, still works |\n\nEvery rung calls the same script. That is the property that matters: adding a loader is\nnever a rewrite.\n\n## Where the kernel actually lives\n\nThe kernel text belongs in a **neutral** file \u2014 `AGENTS.md` \u2014 and each harness's binding is\ngenerated from it by `adapters/install.sh`. Writing the kernel directly into one vendor's\nconfig path is the mistake [[Binding Beats Building]] describes, one level up: it binds the\nOS to a tool instead of to a capability.\n\nRelated: [[Harness Capability Matrix]], [[Git Is The Disk]], [[Binding Beats Building]]\n", "fm": {"created": "2026-08-19", "updated": "2026-08-29", "tags": "[pattern, portability]"}, "links": ["Binding Beats Building", "Git Is The Disk", "Harness Capability Matrix"]}], "raw": [], "output": [], "decisions": [{"name": "2026-08-19 Steering as the boot loader", "body": "---\ndate: 2026-08-19\nupdated: 2026-08-29\nstatus: accepted\n---\n\n# Steering as the boot loader\n\n## Context\nThe OS needs a deterministic boot on every session: load working memory, open loops,\nand lessons before doing any work. Local IDEs and CLIs generally support a\nsession-start hook, whose stdout is injected into context on exit 0. Hosted\nsandboxes generally do not run hooks at all \u2014 and that is the primary surface here.\n\n## Decision\nPut the boot instruction in an **always-included instruction file** pointing at a\nsingle command (`bash bin/os boot`). Ship an equivalent session-start hook for\nsurfaces that support one, calling the same script. One entry point, many loaders.\n\nThe kernel text lives in `AGENTS.md`; per-harness bindings are generated from it by\n`adapters/install.sh` rather than authored separately.\n\n## Tradeoff\nWhat this costs us: the boot is *instructed*, not *enforced*. A sufficiently\ndistracted agent can skip it, where a hook is mechanical. Accepted because the\nalternative on a hosted surface is no boot at all, and because an always-included\nfile has a compensating advantage \u2014 it is re-supplied every turn, so it survives\ncontext compaction that would drop a hook's one-time output.\n\nSecond cost, accepted 2026-08-29: generated bindings can drift from the kernel.\nMitigated by a `selftest` check that fails on drift and names `adapters/install.sh`\nas the fix, rather than by trusting anyone to remember.\n\n## Alternatives rejected\n- **Hook only** \u2014 silently does nothing on hosted surfaces, which is where this runs.\n- **Inline the memory into the kernel** \u2014 puts the entire vault in the context window\n  every turn. Defeats the layering and scales terribly.\n- **A custom sub-agent with preloaded resources** \u2014 unavailable on hosted surfaces,\n  and vendor-specific everywhere else.\n- **Author each harness's config by hand** \u2014 four copies of the same rules, drifting\n  independently. This is the mistake `adapters/` exists to prevent.\n", "fm": {"date": "2026-08-19", "updated": "2026-08-29", "status": "accepted"}, "links": []}]}</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const md = s => marked.parse((s||'').replace(/^---[\s\S]*?\n---\n/, '')
  .replace(/\[\[([^\]|]+)\]\]/g, (_,n)=>`<span class="wl" data-go="${n}">${n}</span>`));
document.getElementById('meta').textContent =
  `generated ${D.generated} · ${D.notes.length} wiki · ${D.raw.length} raw · ` +
  `${D.output.length} output · ${D.decisions.length} decisions · ` +
  `${D.loops.filter(l=>l.status==='open').length} open loops`;

const views = {
  Overview(){
    const open = D.loops.filter(l=>l.status==='open');
    return card('WORKING MEMORY', md(D.state))
      + (open.length ? open.map(loopCard).join('') : card('LOOPS','<p class="dim">no open loops</p>'))
      + card('LESSONS', md(D.lessons))
      + (D.journal[0] ? card('LATEST JOURNAL — '+D.journal[0].name, md(D.journal[0].body)) : '');
  },
  Loops(){ return D.loops.length ? D.loops.map(loopCard).join('') : '<p class="dim">no loops</p>'; },
  Notes(){
    return `<div class="card"><input id="q" placeholder="filter notes…" size="30"></div>`
      + `<div id="notes">` + D.notes.map(n =>
        `<div class="card note" data-n="${n.name.toLowerCase()}" id="n-${cssid(n.name)}">
           <h3>${n.name}</h3>${md(n.body)}
           ${n.links.length?`<p class="dim">links: ${n.links.map(l=>`<span class="wl" data-go="${l}">${l}</span>`).join(', ')}</p>`:''}
         </div>`).join('') + `</div>`;
  },
  Output(){ return D.output.map(o=>card(o.name + statusOf(o), md(o.body))).join('')
    || '<p class="dim">nothing shipped yet — bin/os ship "Title"</p>'; },
  Raw(){ return D.raw.map(r=>`<details class="card"><summary>${r.name}</summary>${md(r.body)}</details>`).join('')
    || '<p class="dim">no captures yet — bin/os capture "Title" [url]</p>'; },
  Decisions(){ return D.decisions.map(d=>card(d.name, md(d.body))).join('') || '<p class="dim">none</p>'; },
  Journal(){ return D.journal.map(j=>`<details class="card" open><summary>${j.name}</summary>${md(j.body)}</details>`).join('') || '<p class="dim">none</p>'; },
};
function statusOf(o){ const s=(o.fm||{}).status; return s?` <span class="dim">${s}</span>`:''; }
function card(t,b){ return `<div class="card"><h3>${t}</h3>${b}</div>`; }
function cssid(s){ return s.replace(/[^a-z0-9]/gi,'-').toLowerCase(); }
function loopCard(l){
  const done = l.steps.filter(s=>s[0]).length, pct = l.steps.length ? done/l.steps.length*100 : 0;
  return `<div class="card"><h3>LOOP · ${l.name} <span class="dim">${l.status} · ${done}/${l.steps.length}</span></h3>
    <div class="bar"><i style="width:${pct}%"></i></div>${md(l.body)}</div>`;
}
let cur = 'Overview';
function render(){
  document.getElementById('nav').innerHTML = Object.keys(views)
    .map(k=>`<button class="${k===cur?'on':''}" data-v="${k}">${k}</button>`).join('');
  document.getElementById('app').innerHTML = views[cur]();
}
document.addEventListener('click', e => {
  const v = e.target.dataset.v, go = e.target.dataset.go;
  if (v) { cur = v; render(); }
  if (go) { cur = 'Notes'; render();
    const el = document.getElementById('n-'+cssid(go));
    el ? el.scrollIntoView({behavior:'smooth'}) : alert('No note yet: '+go); }
});
document.addEventListener('input', e => {
  if (e.target.id !== 'q') return;
  const q = e.target.value.toLowerCase();
  document.querySelectorAll('.note').forEach(n =>
    n.classList.toggle('hide', !n.dataset.n.includes(q)));
});
render();
</script>
