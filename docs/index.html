h no DNS account, no token, and no interactive login, which is less setup than both DuckDNS and Tailscale Funnel when 80/443 are already open. _(2026-08-29)_\n- When an incremental index skips unchanged inputs \u2192 add an explicit backfill pass for outputs that are missing regardless of input change. Because change-detection alone cannot repair damage: a failed embed batch left chunks permanently vector-less, and only a full rebuild fixed it. _(2026-08-29)_\n- When building an automation that gathers information \u2192 have it write only to the capture layer, never to the knowledge layer. Because an automation that promotes its own output produces a vault full of confident material nobody read, indistinguishable from material that was understood. _(2026-08-29)_\n- When a JS module silently fails to execute \u2192 check for a duplicate 'const' in the same block before anything else. Because 'node --check' passes per-file but a block-scope redeclaration is a runtime SyntaxError that aborts module evaluation with no visible error, so the whole page just never initialises. _(2026-08-29)_\n- When asked to make a UI feel alive \u2192 tie one animation to real provenance rather than adding ambient motion. Because hovering a citation to ignite the note it came from answers a question the user actually has, while decorative motion only costs attention. _(2026-08-29)_\n- When a canvas scene drops frames \u2192 find the cheapest thing drawn the most times before optimising anything clever. Because a faint hex background cost more than 15,000 glowing ring dots did, and the tell was that zooming IN made it faster: bigger cells meant fewer of them. _(2026-08-29)_\n- When baking a glow effect to a sprite \u2192 composite the finished sprite with source-over, not lighter. Because the additive accumulation that creates the bloom happens between dots inside the sprite at bake time and is already in the pixels; compositing the result additively costs every pixel again for no visual gain (33fps vs 60). _(2026-08-29)_\n- When generating a stipple or texture procedurally \u2192 use a hash, not a sine, for per-element jitter. Because a periodic function beats against the element spacing and renders as visible dashes or moire. _(2026-08-29)_\n- When a layout algorithm can produce an off-centre result \u2192 recentre on the centroid rather than trusting the generator. Because a hex ring-walk with the wrong direction order drifted every node off one edge, and centroid recentring makes the class of bug impossible instead of fixing one instance. _(2026-08-29)_\n", "loops": [{"name": "deploy-always-on", "status": "open", "steps": [[true, "launch the instance (t3.micro, 30 GB gp3, AL2023)"], [true, "provision the box \u2014 swap, python 3.11 venv, deps, clone, systemd units"], [true, "set the login password with `python -m server.tools.setpass`"], [true, "TLS: Caddy + Let's Encrypt on `<dashed-ip>.sslip.io`, certificate obtained"], [true, "set `AGENTOS_BASE_URL` to the https host, restart, sign in over HTTPS from outside"], [true, "confirm a wrong password is rejected and repeated failures return 429 (the security test, not a formality)"], [true, "index built on the box \u2014 confirm FTS5 + vector row counts match the file count"], [true, "load the orbit UI in a browser, search with `/`, open a note, confirm the preview renders"], [true, "`sudo reboot`, then confirm it comes back with no manual intervention"], [true, "`agentos-sync.timer` enabled \u2014 confirm an unattended git pull + reindex"], [true, "put `OPENROUTER_API_KEY` in `server/.env` (openrouter.ai/keys) and restart"], [true, "ask one RAG question, verify every citation points at a file that actually exists"], [false, "rotate the EC2 keypair and narrow the SSH source from 0.0.0.0/0 to one IP"], [false, "set a billing alarm at $20/mo and record the real observed cost in Notes"]], "body": "---\nloop: deploy-always-on\nstatus: open\ncheck: curl -fsS https://$AGENTOS_HOST/healthz\ncreated: 2026-08-19\nupdated: 2026-08-29\n---\n\n# Goal\nMove AgentOS off ephemeral sandboxes and onto an always-on machine the user controls,\nwhere an agentic OS can actually be persistent: a daemon that survives reboot, a\nscheduler that fires with the laptop shut, hybrid search over the whole vault, and a\nweb UI reachable from anywhere behind a login. Host is an EC2 `t3.micro` inside the\ncredit-based free tier. The `brain/` vault stays the git-versioned, Obsidian-readable\nsource of truth; everything on the box is a disposable index in front of it.\n\n# Done when\n`https://<host>/healthz` returns 200 over real TLS; the password admits exactly one\nuser, wrong ones are rejected and repeated failures lock out; the orbit UI renders the live vault; a RAG answer\ncites real note paths; a `systemd` timer has pulled from git and reindexed unattended\nat least once; and the whole thing comes back by itself after `sudo reboot`.\n\n# Steps\n- [x] launch the instance (t3.micro, 30 GB gp3, AL2023)\n- [x] provision the box \u2014 swap, python 3.11 venv, deps, clone, systemd units\n- [x] set the login password with `python -m server.tools.setpass`\n- [x] TLS: Caddy + Let's Encrypt on `<dashed-ip>.sslip.io`, certificate obtained\n- [x] set `AGENTOS_BASE_URL` to the https host, restart, sign in over HTTPS from outside\n- [x] confirm a wrong password is rejected and repeated failures return 429 (the security test, not a formality)\n- [x] index built on the box \u2014 confirm FTS5 + vector row counts match the file count\n- [x] load the orbit UI in a browser, search with `/`, open a note, confirm the preview renders\n- [x] `sudo reboot`, then confirm it comes back with no manual intervention\n- [x] `agentos-sync.timer` enabled \u2014 confirm an unattended git pull + reindex\n- [x] put `OPENROUTER_API_KEY` in `server/.env` (openrouter.ai/keys) and restart\n- [x] ask one RAG question, verify every citation points at a file that actually exists\n- [ ] rotate the EC2 keypair and narrow the SSH source from 0.0.0.0/0 to one IP\n- [ ] set a billing alarm at $20/mo and record the real observed cost in Notes\n\n# Notes\n- Inference stays **remote** on purpose. A box that can hold a useful model costs ~10x a\n  box that can hold an index, and is worse. Only the embedding model is local\n  (quantised MiniLM, CPU, ~90 MB). See [[Local Runtime Closes The Gaps]].\n- Free tier here is **credit-based** ($100-class credit with an expiry), not the old\n  always-free instance-hours. So cost is credit burn: t3.micro + 30 GB gp3 \u2248 $10/mo.\n  A t3.small doubles compute and halves the runway \u2014 not worth it for an index.\n- 1 GB RAM is the real constraint. Hence SQLite FTS5 + sqlite-vec (no daemon) rather\n  than Postgres + pgvector, and ONNX int8 rather than PyTorch. 2 GB swap for reindex\n  headroom.\n- Tailscale Funnel gives a real Let's Encrypt cert on a stable `*.ts.net` hostname with\n  no domain purchase and no port 443 exposed to the world. The alternative (DuckDNS +\n  Caddy DNS-01) also works and is documented in `deploy/README.md`.\n- Security rule: the SG opens **22 only**. The app is never bound to a public interface\n  directly \u2014 Funnel terminates TLS and forwards to localhost. A password sent over\n  plain HTTP is sent in the clear on every request: not protected, decorated.\n- Do not delete anything from `brain/` because the index can answer faster. The index is\n  a cache; deleting the markdown trades an auditable artifact for a database you cannot\n  diff. See [[Git Is The Disk]].\n\n## 2026-08-29 \u2014 deployed and verified\n\nLive at `https://13-218-239-165.sslip.io`. Measured on the box, not assumed:\n\n- 913 MB RAM, 2 vCPU, 30 GB disk. App uses **247 MB against a 700 MB systemd cap**;\n  host sits at ~354 MB with 0 MB of swap touched. The 2 GB swap file was still worth\n  creating \u2014 the `onnxruntime` install is the peak, not the steady state.\n- Index: 15 docs / 63 chunks / **63 vectors**, hybrid. Full build took 42 s including\n  the first-run model download.\n- Reboot test: back in **~30 s** with `agentos`, `caddy`, and the sync timer all\n  active, nothing started by hand.\n- TLS: real Let's Encrypt certificate, `ssl_verify_result=0` verified from outside.\n  `sslip.io` needs no DNS account and no token, which makes it strictly less work\n  than DuckDNS *and* than Tailscale Funnel for a box that already has 80/443 open.\n- Port 8000 confirmed **not** reachable publicly; Caddy is the only listener.\n\nTwo bugs the deploy found that local testing had not:\n\n1. `meta.mode` was derived from how many chunks *that run* embedded, so the first\n   incremental run by the sync timer relabelled a fully hybrid index as\n   \"keyword-only\". The status pill was lying. Mode now describes the index.\n2. Caddy's packaged systemd unit is sandboxed and cannot write `/var/log/caddy`, so\n   a `log { output file \u2026 }` block makes the whole config fail to load. Journald only.\n\nLesson worth keeping: **a deploy is a test.** Both bugs were invisible in the\nsandbox and immediate on the box.\n"}, {"name": "harden-agentos", "status": "open", "steps": [[true, "scaffold kernel, skills, vault, `bin/os`, dashboard"], [true, "verify `boot`, `selftest`, and `dash` run clean in this sandbox"], [true, "push to a remote and confirm `save` round-trips (this is the durability test)"], [false, "open a fresh session on this repo, boot cold, confirm context loads"], [false, "clone locally, open `brain/` in Obsidian, confirm graph and links resolve"], [false, "boot on a second harness via `adapters/install.sh` \u2014 confirm the kernel loads unmodified"], [false, "enable GitHub Pages on `docs/` and confirm the dashboard renders"], [false, "run one non-trivial task end to end using only loop + save discipline"], [false, "prune whatever turned out to be dead weight \u2014 deletion is a step too"]], "body": "---\nloop: harden-agentos\nstatus: open\ncheck: bash bin/os selftest\ncreated: 2026-08-19\n---\n\n# Goal\nProve every AgentOS subsystem actually survives a real session boundary, on any\nharness, and fix whatever doesn't. The claim under test: a fresh session with zero\nconversation history can reconstruct full working context from `bin/os boot`\nalone, and hand it back off cleanly.\n\n# Done when\n`bash bin/os selftest` passes, and a brand-new session \u2014 no prior transcript \u2014\ncorrectly answers \"what were we doing and what's next?\" using only the boot\noutput, then advances one step of this loop and pushes it.\n\n# Steps\n- [x] scaffold kernel, skills, vault, `bin/os`, dashboard\n- [x] verify `boot`, `selftest`, and `dash` run clean in this sandbox\n- [x] push to a remote and confirm `save` round-trips (this is the durability test)\n- [ ] open a fresh session on this repo, boot cold, confirm context loads\n- [ ] clone locally, open `brain/` in Obsidian, confirm graph and links resolve\n- [ ] boot on a second harness via `adapters/install.sh` \u2014 confirm the kernel loads unmodified\n- [ ] enable GitHub Pages on `docs/` and confirm the dashboard renders\n- [ ] run one non-trivial task end to end using only loop + save discipline\n- [ ] prune whatever turned out to be dead weight \u2014 deletion is a step too\n\n# Notes\n- 2026-08-19: `boot` output is ~40 lines with a seeded vault. Watch that number as\n  the journal grows; boot prints only the last two entries for that reason.\n- Durability is the one property that cannot be verified inside a single session.\n  Steps 3 and 4 are the real test; everything before them is scaffolding.\n- 2026-08-19: `bin/os save` round-trip confirmed against origin/agentos. Repo creation via the sandbox gateway is blocked (403 REST, GraphQL passthrough refused), so AgentOS ships as a branch/PR on an existing repo.\n- 2026-08-19: step 4 first attempt FAILED \u2014 session had no repo bound, so nothing cloned. Root cause and fix in [[Binding Beats Building]]. Sidecar clone+boot verified from an empty workspace; the remaining half of step 4 is a fresh session *with the global kernel installed*.\n- 2026-08-19: I ticked step 4 without doing it. Unticked. Step 4 requires a fresh session on the user side; no in-session evidence can satisfy it. What IS verified: the exact global-kernel boot command works from an empty workspace against the new repo.\n- 2026-08-29: added a cross-harness step. The kernel now lives in `AGENTS.md` with generated bindings, so \"does it boot somewhere else\" became a testable claim rather than an aspiration. `selftest` gained a drift check that fails if a binding no longer matches the kernel.\n"}], "journal": [{"name": "2026-08-29", "body": "---\ndate: 2026-08-29\n---\n\n# 2026-08-29\n\n- 02:36Z \u2014 Made AgentOS harness-agnostic: kernel moved to AGENTS.md, per-vendor bindings generated by adapters/install.sh (claude, kiro, cursor, copilot, windsurf, gemini, agents.md), cloud-config -> config/. selftest gained a binding-drift check.\n- 02:36Z \u2014 Vault restructured into raw -> wiki -> output layers with bin/os capture and bin/os ship as entry points. Renamed the three vendor-named notes and rewrote every inbound wikilink; journal left untouched because it is append-only.\n- 02:36Z \u2014 Built server/: FastAPI + hybrid retrieval (SQLite FTS5/BM25 + sqlite-vec, weighted RRF), local quantised BGE embeddings, Google OAuth with a single-email allowlist, and an interactive ARMS orbit UI with no framework or CDN.\n- 02:36Z \u2014 Measured retrieval instead of assuming it. Found three real bugs: fastembed query_embed is a no-op for bge-small (cosine 1.0000 vs embed) so the BGE instruction prefix is now applied explicitly; FTS5's porter tokenizer keeps stopwords, which buried 'Git Is The Disk' under its own title words; unweighted RRF scored worse than semantic alone on a small corpus. Tuned to RRF_K=20 / W_SEMANTIC=2.0 \u2014 hybrid now beats both halves on top-5 (9/10).\n- 02:36Z \u2014 Verified the UI by screenshotting it headless rather than trusting the source. Caught the canvas being measured before layout, which had rendered the whole map into a 300x150 corner, plus faint ring bands, a label pile-up, and a banner covering a ring label.\n- 02:36Z \u2014 Wrote deploy/ for a t3.micro (~$10/mo): swap, venv, systemd unit with MemoryMax, a 15-minute pull+reindex timer, and Tailscale Funnel for real TLS with no domain purchase and no inbound port.\n- 03:14Z \u2014 Replaced Google OAuth with single-user password auth: PBKDF2-SHA256 (stdlib), hmac.compare_digest, per-IP lockout, sessions bound to a credential fingerprint so rotating the password invalidates them. Verified every negative path \u2014 wrong password 401, wrong username 401, lockout 429, unset password denies everyone, stale session evicted.\n- 03:25Z \u2014 Deployed to EC2 and verified end to end over public HTTPS: real Let's Encrypt cert on sslip.io, password auth, hybrid index with 63 vectors, orbit UI rendering the live vault, and a reboot test that came back in ~30s untouched.\n- 04:17Z \u2014 Added automations: radar (6 keyless feeds), research (topic gather), distill (LLM triage). All write to brain/raw or brain/output; nothing writes to wiki automatically.\n- 04:17Z \u2014 Added skills: research (sources/triage routers), taste (ui/writing/code/review checklists \u2014 concrete checkable rules, not vibes), skill-forge (the meta-skill).\n- 04:17Z \u2014 Wrote 6 method notes: Context Rot, Progressive Disclosure, Provenance Or It Didnt Happen, Signal Triage, Evals Before Vibes, Taste Is A Checklist. Evals Before Vibes exists because the first machine digest noticed its own capture contained nothing on evaluation.\n- 04:17Z \u2014 Rebuilt the UI: boot sequence on real telemetry, one command bar (search / ? ask / > run), focus mode that dims everything more than one link away, signal pulses along edges, coverage ring, and citation chips that ignite the source node on hover. prefers-reduced-motion respected throughout.\n- 04:44Z \u2014 Gauntlet: 8 screenshot-graded passes on the map. Fixed in order \u2014 faint bands, then bands so bright they drowned the nodes and broke label contrast, then moire from a sine twinkle, then 21fps from a live hex field, then a hex layout that walked off-screen, then a layout control that lied when set programmatically. Ends at 60fps in software rendering.\n- 04:44Z \u2014 Added 4 layouts (rings/circle/hex/force) with tweened transitions, a control dock (layout, labels, ring spin, node size), Fly to, per-zone node glyphs, and the fix for skills nodes 404ing because /api/doc never searched system docs.\n", "fm": {"date": "2026-08-29"}, "links": []}, {"name": "2026-08-19", "body": "---\ndate: 2026-08-19\n---\n\n# 2026-08-19\n\n- Researched whether a persistent agentic OS can run inside Kiro. Answer: yes, but\n  only on the primitives Web actually loads \u2014 steering, skills, specs, bash, git.\n- Established the binding constraints. Hooks, custom agents, and repo `mcp.json`\n  are unavailable on Kiro Web; the sandbox is torn down per task. Recorded in\n  [[Kiro Web Capability Matrix]] and [[Git Is The Disk]].\n- Chose `inclusion: always` steering as the boot loader instead of a\n  `SessionStart` hook. Decision and tradeoff written up.\n- Built the runtime: `bin/os` (boot/log/lesson/note/decide/recall/loop/dash/save/\n  selftest), `bin/osutil.py` for parsing and the dashboard, seeded `brain/`.\n- Adapted the Ralph loop to a surface where the agent can't re-invoke itself: the\n  ledger is the loop counter, the session is the loop body. See [[Ralph Loop]].\n- Skipped a vector store. Grep plus a hot `STATE.md` covers retrieval at this\n  scale; reasoning in [[Grep Beats Embeddings Here]].\n- 13:24Z \u2014 pushed to origin/agentos and opened PR #11; dashboard verified rendering in a headless browser (5 notes, 25 wikilinks, tab nav and filter all work)\n- 13:44Z \u2014 cold-boot test failed for a binding reason, not a design one: session had no repo selected, and main has no .kiro since PR #11 is unmerged. Added a self-bootstrapping global kernel for Settings -> Cloud configuration; verified clone+boot from a fully empty workspace.\n- 13:52Z \u2014 migrated the brain from test-repo/agentos into its own private repo jmbilbao25/Agentic-OS on main; global kernel now clones to /projects/sandbox/Agentic-OS with no branch flag\n- 14:03Z \u2014 clarified cloud config: UI takes one .kiro-type folder at a time, name-identified. Restructured so cloud-config/{steering,skills} hold the real files and .kiro/ symlinks into them - one source of truth. Added Android upload path since the phone picker blocks Download/ and storage root.\n- 14:15Z \u2014 researched and TESTED the local path: installed Claude Code (v2.1.235, refuses without Anthropic auth) and Kiro Crew (0.2.0, doctor clean, provider=acp via kiro-cli). Crew closes every gap Web could not: cron, service install, spawn, run <spec>, six-layer memory with FAISS, dashboard, snapshot/restore. Opened the go-local loop.\n", "fm": {"date": "2026-08-19"}, "links": ["Git Is The Disk", "Grep Beats Embeddings Here", "Kiro Web Capability Matrix", "Ralph Loop"]}], "notes": [{"name": "Binding Beats Building", "body": "---\ncreated: 2026-08-19\nupdated: 2026-08-29\ntags: [constraints, postmortem, portability]\n---\n\n# Binding Beats Building\n\nFirst cold-boot test failed. A fresh session asked \"what are we doing?\" and answered\n\"nothing \u2014 empty workspace, no prior context.\" The OS was fine. The session was never\nbound to anything containing it.\n\nTwo independent causes, both about delivery rather than design:\n\n1. **No repo selected.** Hosted harnesses clone repos server-side at session creation.\n   No repo \u2192 no clone \u2192 no kernel file \u2192 no boot. A kernel cannot bootstrap itself from\n   a repo it was never given.\n2. **Wrong branch even if selected.** Hosted harnesses typically clone the *default*\n   branch and offer no branch picker. The OS lived on an unmerged branch, so the default\n   branch had no kernel at all. A repo-bound session would still have booted empty.\n\nThe general lesson: **a config-file OS is only as persistent as its delivery mechanism.**\nA kernel-in-the-repo gives you persistence *within a bound repo*; it gives you nothing in\na session bound to nothing. Those are different guarantees and they are easy to conflate.\n\nThe fix is a second kernel at a scope **above** the repo \u2014 the harness's user/global\nconfig slot, which is injected into every session regardless of what was cloned. That\nkernel has to be **self-bootstrapping**: it cannot reference `bin/os`, because in a\nrepo-less sandbox no such file exists yet. So it carries the clone command itself and\ntreats the brain as a sidecar repo with its own remote. That file is\n`config/kernel-global.md`.\n\nVerified: from a completely empty workspace, a shallow clone of the brain followed by\n`bin/os boot` reconstructs full working memory. One command, no repo binding, ~2 seconds.\n\nCorollary worth keeping: the sidecar model is *better* than the repo-resident model for\ncross-project memory. A brain that lives in its own repo and is cloned into whatever\nsandbox needs it accumulates lessons across every project, instead of one silo per repo.\n\nSecond corollary, learned later: the same argument applies across *harnesses*, not just\nrepos. A kernel written for one vendor's config path is bound to that vendor. Keeping the\nkernel in a neutral file and generating the vendor-specific bindings from it \u2014 see\n`adapters/` \u2014 is the same \"binding beats building\" insight applied one level up.\n\nRelated: [[Harness Capability Matrix]], [[Git Is The Disk]], [[Steering as Boot Loader]]\n", "fm": {"created": "2026-08-19", "updated": "2026-08-29", "tags": "[constraints, postmortem, portability]"}, "links": ["Git Is The Disk", "Harness Capability Matrix", "Steering as Boot Loader"]}, {"name": "Context Rot", "body": "---\ncreated: 2026-08-29\ntags: [context, loops, reliability]\n---\n\n# Context Rot\n\nAgent output quality degrades as the context window fills, and it degrades *before*\nthe window is full. A long session does not fail at the limit; it gets gradually\nworse for a long time first, which is much harder to notice.\n\nThree separable causes:\n\n1. **Dilution.** Relevant instructions compete with accumulated irrelevance for\n   attention. The instruction is still present and still ignored.\n2. **Contradiction.** Early exploratory statements are still in the transcript when\n   the conclusion contradicts them. Both are \"context\", and nothing marks the first\n   as superseded.\n3. **Compaction loss.** Summarising a long session drops the middle. What survives\n   is the beginning and the recent \u2014 and the decisions usually happened in the\n   middle.\n\n## Why this argues for resetting rather than persisting\n\nThe instinct is to keep one long session so the agent \"remembers\". That is exactly\nbackwards. Externalise the state and reset ruthlessly:\n\n- the **ledger** remembers, not the transcript \u2014 see [[Ralph Loop]]\n- **git** is the disk, not the session \u2014 see [[Git Is The Disk]]\n- the **kernel** is re-supplied every turn, so it survives compaction where a\n  session-start hook's output does not \u2014 see [[Steering as Boot Loader]]\n\nA fresh context window plus a good ledger beats a full context window plus a hopeful\ntranscript, every time.\n\n## Symptoms, in order of appearance\n\n1. Earlier instructions stop being followed precisely.\n2. The agent re-derives something it already established.\n3. Confident statements contradict decisions made earlier in the same session.\n4. Ticking a step it did not actually complete. This one is the reliable alarm \u2014\n   it happened in this repo and the correction is preserved in the\n   `harden-agentos` ledger deliberately.\n\n## Practice\n\n- One loop step per session where the work allows it. Tick, save, stop.\n- Write conclusions to files *as they happen*, not at the end. \"I'll summarise\n  later\" loses to a context limit.\n- When a decision supersedes an earlier one, **rewrite** the earlier statement\n  rather than appending the correction. Two versions in one context is a\n  contradiction the model has to resolve, and it may resolve it wrongly.\n- Treat \"I'm deep in a long session\" as a reason to save and stop, not as momentum\n  worth protecting.\n\n## The uncomfortable implication\n\nMost of what feels like productive momentum in a long agent session is the\ntranscript getting worse. The instinct to keep going is the symptom.\n\nRelated: [[Ralph Loop]], [[Progressive Disclosure]], [[Git Is The Disk]], [[Steering as Boot Loader]]\n", "fm": {"created": "2026-08-29", "tags": "[context, loops, reliability]"}, "links": ["Git Is The Disk", "Progressive Disclosure", "Ralph Loop", "Steering as Boot Loader"]}, {"name": "Evals Before Vibes", "body": "---\ncreated: 2026-08-29\ntags: [reliability, testing, retrieval]\n---\n\n# Evals Before Vibes\n\nIf you cannot measure a system's quality, you cannot tell improvement from\nregression \u2014 and you will confidently ship regressions, because a change you\nbelieved in *feels* like an improvement.\n\nThis note exists because the first automated digest this repo produced observed that\nits own capture contained nothing about evaluation or failure logging for personal\nagents, and that this is \"exactly where a personal OS will silently degrade\". That\nwas correct, and it was a gap here too.\n\n## The concrete case\n\nRetrieval in this repo was tuned by measurement, not intuition, and every intuition\nturned out to be wrong:\n\n| Belief | Measurement |\n|---|---|\n| \"hybrid search beats either half\" | naive RRF scored **worse** than semantic alone |\n| \"the library handles query embedding\" | `query_embed()` was a **no-op** \u2014 cosine 1.0000 vs `embed()` |\n| \"keyword search is a fine baseline\" | stopwords buried the note literally titled *Git Is The Disk* |\n\nNone of those would have been found by using the system and feeling good about it.\nAll three took a ten-line benchmark. It lives at\n`server/tools/eval_retrieval.py` and runs in seconds.\n\n## What a minimum viable eval looks like\n\nNot a framework. A file with ten cases and an expected answer.\n\n- **Probes that share little vocabulary with their target**, so keyword matching\n  cannot pass them by accident.\n- **Plus exact-match probes** that keyword search must still win \u2014 otherwise you\n  \"improve\" semantic recall by destroying filename lookup and never notice.\n- **A single number** you can compare across runs.\n- **Committed to the repo**, so a future change can be checked against the same bar.\n\n## The rule that keeps it honest\n\n> Add a probe whenever the system fails to find something you knew was there.\n\nA benchmark containing only cases you already pass is decoration. Its score goes up\nover time while the system does not improve, which is worse than having no benchmark\nbecause it manufactures confidence.\n\n## Beyond retrieval\n\nThe same argument applies to everything an agent OS does, and most of it is\nunmeasured here \u2014 stated plainly rather than glossed:\n\n| Subsystem | Measured? |\n|---|---|\n| retrieval quality | yes \u2014 `eval_retrieval.py` |\n| vault well-formedness | yes \u2014 `bin/os selftest`, with both guards proven by negative test |\n| auth negative paths | yes \u2014 wrong password, wrong user, lockout, stale session |\n| index integrity | yes \u2014 coverage + partial flag, self-healing verified |\n| **answer quality (RAG)** | **no** \u2014 citations are checked for existence, not for support |\n| **digest usefulness** | **no** \u2014 no ground truth exists |\n| **whether the OS makes work better** | **no**, and probably unmeasurable |\n\nNaming the unmeasured parts is the point. An honest gap list is a roadmap; an\nimplied claim of full coverage is a lie that costs you later.\n\n## Exit code is not evidence\n\nA command exiting 0 proves it ran. Assert on the observable outcome: row counts,\nHTTP status, rendered DOM, file contents, the actual number. This repo's own history\ncontains a step ticked without being done, preserved deliberately in the\n`harden-agentos` ledger \u2014 the discipline working exactly once it was written down.\n\nRelated: [[Provenance Or It Didnt Happen]], [[Grep Beats Embeddings Here]], [[Signal Triage]]\n", "fm": {"created": "2026-08-29", "tags": "[reliability, testing, retrieval]"}, "links": ["Grep Beats Embeddings Here", "Provenance Or It Didnt Happen", "Signal Triage"]}, {"name": "Git Is The Disk", "body": "---\ncreated: 2026-08-19\nupdated: 2026-08-29\ntags: [persistence, portability]\n---\n\n# Git Is The Disk\n\nThe documented sandbox lifecycle for hosted agent harnesses is: provision \u2192 clone repos\n\u2192 configure \u2192 execute \u2192 **tear down**. Elsewhere the same docs usually claim a session's\nfile state persists in the cloud. Those two statements are never reconciled, and sessions\nget deleted on a timer regardless.\n\nSo the safe model, and the one this OS is built on: **the sandbox filesystem is a scratch\ndisk, and the git remote is storage.** A thought that isn't pushed didn't happen.\n\nPractical consequences:\n\n- `bin/os save` is part of the workflow, not a chore at the end. It runs after every\n  durable decision.\n- The vault lives *inside the repo* (`brain/`), not in a home directory or a config folder\n  outside the clone. Anything outside the clone is presumed lost.\n- Commit granularity is memory granularity: `git log brain/` is a legible history of what\n  the agent learned and when. `git blame brain/lessons.md` shows when a lesson was learned\n  and which session learned it.\n- This is also the sync mechanism for humans: clone the repo, open `brain/` in Obsidian,\n  and the Obsidian Git plugin round-trips edits back.\n\nThe upside of the constraint: memory is diffable, reviewable in a PR, and revertable. A\n`brain/` change can be rejected in code review \u2014 a property no vector store has.\n\n## This is also the portability argument\n\nGit as the disk is what makes the OS survive a change of harness, not just a change of\nsession. The vault is markdown; the runtime is one shell script; storage is a protocol\nevery tool on earth speaks. Swap the agent, the model, the vendor, or the machine and the\nmemory is untouched.\n\nAny component that wants to hold state somewhere other than git \u2014 a database, a vendor's\nmemory feature, a vector index \u2014 is welcome to, **as a cache**. The moment it becomes the\nonly copy, you have traded an auditable artifact for a dependency. See\n[[Local Runtime Closes The Gaps]].\n\nRelated: [[Harness Capability Matrix]], [[Grep Beats Embeddings Here]], [[Local Runtime Closes The Gaps]]\n", "fm": {"created": "2026-08-19", "updated": "2026-08-29", "tags": "[persistence, portability]"}, "links": ["Grep Beats Embeddings Here", "Harness Capability Matrix", "Local Runtime Closes The Gaps"]}, {"name": "Grep Beats Embeddings Here", "body": "---\ncreated: 2026-08-19\nupdated: 2026-08-29\ntags: [memory, retrieval]\n---\n\n# Grep Beats Embeddings Here\n\nRetrieval over this vault is keyword-first, and for the *agent* it stays that way. Not\nbecause semantic search is bad, but because at this scale the ranking gain rarely pays\nfor the machinery \u2014 and because grep's failure mode is honest.\n\nWhat a vector-only store adds: an embedding service, an index that must be rebuilt when\nnotes change, a similarity threshold to tune, a process to run, and a silent failure mode\nwhere the index is stale and recall quietly degrades.\n\nWhat grep costs: nothing. It is exact, instant on thousands of files, and zero hits means\nzero hits.\n\nThe structure does the work embeddings would otherwise do:\n\n- `STATE.md` is a hot cache \u2014 the highest-value context is already loaded, so most queries\n  never need retrieval at all.\n- `[[wikilinks]]` are a hand-built relevance graph. Following links from one hit finds the\n  neighbours a similarity search would surface.\n- Atomic notes with descriptive filenames make filename matching a decent first pass.\n\n## Update 2026-08-29: the revisit condition fired\n\nThe original note named its own exit condition \u2014 *\"add semantic search as a second pass\nover grep, keeping markdown as the source of truth so the index stays disposable.\"* Two\nthings triggered it:\n\n1. A **human** browsing a visual second brain searches by half-remembered concept, not by\n   keyword. \"That thing about why memory should be diffable\" has no reliable search term.\n2. A **RAG answer** needs passages ranked across the whole vault, which is exactly the job\n   keyword search is worst at.\n\nSo `server/` now runs **hybrid** retrieval, built to honour the original constraint rather\nthan abandon it:\n\n| Decision | Why it keeps the note's spirit |\n|---|---|\n| SQLite **FTS5 + BM25** for the keyword half | zero new dependency; grep-grade honesty, better ranking |\n| **sqlite-vec** for the vector half | a file, not a service \u2014 no daemon to keep alive |\n| Quantised MiniLM, CPU-only, ~90 MB | runs on a `t3.micro`; no GPU, no API call to embed |\n| **Reciprocal Rank Fusion** to combine them | keyword hits still surface even when embeddings whiff |\n| Index rebuilt from markdown, never authored | the index is disposable; delete it and reindex |\n\nThe load-bearing rule is unchanged and non-negotiable: **markdown is the source of truth\nand the index is a cache.** `bin/os recall` still greps, because an agent mid-task wants a\ndeterministic answer. Semantic search is a *second* pass for humans and for RAG, exactly as\nthis note originally prescribed.\n\nThe distinction worth keeping: **agents recall, humans browse.** Those want different\nretrieval, and it is fine to run both as long as only one of them is authoritative.\n\nRelated: [[Git Is The Disk]], [[Harness Capability Matrix]], [[Local Runtime Closes The Gaps]]\n", "fm": {"created": "2026-08-19", "updated": "2026-08-29", "tags": "[memory, retrieval]"}, "links": ["Git Is The Disk", "Harness Capability Matrix", "Local Runtime Closes The Gaps", "wikilinks"]}, {"name": "Harness Capability Matrix", "body": "---\ncreated: 2026-08-19\nupdated: 2026-08-29\ntags: [constraints, portability]\n---\n\n# Harness Capability Matrix\n\nEvery agent harness loads a *subset* of the config surface it documents, and which\nsubset decides the entire design of an agentic OS. Audit the surface before building\non it, because the failure mode is silent: an unsupported config file does not error,\nit simply never loads.\n\n## The primitives worth auditing\n\nFor any harness, ask which of these actually work \u2014 not which are documented:\n\n| Primitive | Why it matters | Typical answer |\n|---|---|---|\n| always-on instruction file | the boot loader; without it there is no kernel | usually \u2705 |\n| skills / reusable procedures | SOPs as commands instead of re-prompting | often \u2705 |\n| session-start hook | makes boot *enforced* rather than merely instructed | \u2705 local, \u274c hosted |\n| scheduler / cron | routines that fire with the laptop shut | \u274c hosted, \u2705 own machine |\n| long-lived daemon | anything that must survive logout | \u274c hosted, \u2705 own machine |\n| custom sub-agents | per-role tool restrictions and model routing | inconsistent |\n| repo-level MCP config | connectors that travel with the project | inconsistent |\n| user/global config scope | a brain that follows you into any project | inconsistent |\n| shell + internet | the escape hatch that makes everything else recoverable | almost always \u2705 |\n| filesystem durability | whether anything survives the session | **assume \u274c** |\n\n## The two conclusions that generalise\n\n**1. Hosted sandboxes give you instructions, not enforcement.** No hook, no cron, no\ndaemon. So the boot sequence has to live in an always-included instruction file that\nis re-supplied every turn \u2014 which is more compaction-proof than a hook anyway. See\n[[Steering as Boot Loader]].\n\n**2. The filesystem is a scratch disk.** Every hosted harness either tears the\nsandbox down per task or expires sessions on a timer, and the docs are usually\nself-contradictory about which. Treat durability as absent until measured. See\n[[Git Is The Disk]].\n\nTogether those force the same architecture regardless of vendor: **a small imperative\nkernel, a markdown vault, one shell entry point, and git as storage.** Nothing in\nthat list is proprietary, which is why the OS ports in an afternoon when the harness\nchanges.\n\n## Auditing a new harness\n\n1. Write the smallest possible always-on instruction file. Start a session. Did it\n   load? That is your kernel slot.\n2. Try a session hook. If it fires, promote boot from instructed to enforced.\n3. Look for a scheduler. If there isn't one, routines need an always-on machine \u2014\n   see [[Local Runtime Closes The Gaps]].\n4. Write a file outside the repo, end the session, come back. Assume it's gone; you\n   are only checking whether you were pleasantly surprised.\n5. Record the answers here, then delete whatever the harness made redundant.\n\nRelated: [[Steering as Boot Loader]], [[Git Is The Disk]], [[Local Runtime Closes The Gaps]], [[Ralph Loop]]\n", "fm": {"created": "2026-08-19", "updated": "2026-08-29", "tags": "[constraints, portability]"}, "links": ["Git Is The Disk", "Local Runtime Closes The Gaps", "Ralph Loop", "Steering as Boot Loader"]}, {"name": "Local Runtime Closes The Gaps", "body": "---\ncreated: 2026-08-19\nupdated: 2026-08-29\ntags: [runtime, deployment, persistence]\n---\n\n# Local Runtime Closes The Gaps\n\nEvery gap in [[Harness Capability Matrix]] \u2014 no enforced boot, no cron, no daemon, no\ncustom agents \u2014 is a gap in the *hosting*, not in the OS. Move the same vault and the\nsame `bin/os` onto a machine you control and all of them close at once.\n\n## What a machine you control adds\n\n| Missing capability | What provides it |\n|---|---|\n| enforced boot | a real session hook, or a wrapper script around the agent CLI |\n| routines that fire with your laptop shut | `cron` / `systemd` timers |\n| survives logout and restarts on crash | a `systemd` unit |\n| unattended loop advancement | a timer calling `bin/os loop next` |\n| semantic recall over the whole vault | an indexer + a local embedding model |\n| a real UI | a small HTTP server in front of the vault |\n\nNone of that needs a vendor feature. It needs a box with an uptime.\n\n## The two viable hosts\n\n**Your own hardware.** Free, private, and asleep half the time. A laptop that sleeps\nis a poor host for a scheduler, so this works for interactive use and fails for\nroutines.\n\n**A small always-on server.** A `t3.micro`-class instance is enough for the vault, a\nhybrid search index, and a quantised embedding model, because none of those are heavy\n\u2014 the *model inference* is remote. Roughly $10/month, and it is awake at 4am when the\nroutine fires. This is what `deploy/` provisions and what the `deploy-always-on` loop\ntracks.\n\n## Keep the model remote\n\nThe temptation on any server is to run inference locally too. Resist it at small\nsizes: a box that can hold a useful model costs an order of magnitude more than a box\nthat can hold an index, and the quality is worse. Keep inference behind an\nOpenAI-compatible endpoint and treat the provider as swappable \u2014 see\n[[Model Access Is Not Transferable]] for why pinning yourself to one vendor's auth is\nthe thing that actually strands you.\n\nWhat *does* belong on the box: the vault, the search index, the embedding model\n(quantised, ~90 MB, CPU-only), the scheduler, and the web UI.\n\n## Why this doesn't invalidate the vault\n\nThe vault stays the durable, portable, auditable layer. Any runtime with a database\nwill offer you better recall than markdown plus grep, and you should use it \u2014 as an\n*index*, not as the source of truth. State in a database is state you cannot diff,\ncannot review in a PR, and cannot read in five years without the software that wrote\nit. Markdown in git survives the runtime that indexes it.\n\nThe rule: **indexes are disposable, the vault is not.** Anything that inverts that\nrelationship is a trap, however good the retrieval is.\n\nRelated: [[Harness Capability Matrix]], [[Git Is The Disk]], [[Model Access Is Not Transferable]], [[Grep Beats Embeddings Here]]\n", "fm": {"created": "2026-08-19", "updated": "2026-08-29", "tags": "[runtime, deployment, persistence]"}, "links": ["Git Is The Disk", "Grep Beats Embeddings Here", "Harness Capability Matrix", "Model Access Is Not Transferable"]}, {"name": "Model Access Is Not Transferable", "body": "---\ncreated: 2026-08-19\nupdated: 2026-08-29\ntags: [auth, licensing, portability, verified]\n---\n\n# Model Access Is Not Transferable\n\nA subscription to one vendor's agent product does not grant model access to a\ndifferent vendor's agent product, even when both sit on top of the same underlying\nmodel. This is a licensing boundary, not a missing feature, and no amount of config\ngets around it.\n\nVerified the hard way: installing a vendor's coding CLI works fine, and then it asks\nto log in \u2014 and the only credentials it accepts are that vendor's own. A subscription\npurchased elsewhere is not one of them.\n\n## What agent CLIs actually authenticate against\n\nAlmost every one accepts exactly three categories:\n\n1. **That vendor's own subscription**, via OAuth.\n2. **That vendor's own API key**, from their console.\n3. **A cloud reseller** the vendor has a deal with \u2014 Bedrock, Vertex, Foundry.\n\nAn entitlement bought from anyone outside those three is not convertible. Vendor terms\ngenerally *forbid* third parties from exposing their consumer login or rate limits to\nother products, so anything that appears to bridge two ecosystems is either violating\nterms or is a paid gateway quietly reselling tokens at a markup.\n\n## The design consequence\n\nDo not build an OS that assumes a particular provider's auth. Build it so the provider\nis one environment variable.\n\n- Talk to models over the **OpenAI-compatible chat-completions shape**. It is the de\n  facto interop layer; nearly every provider and every local server speaks it.\n- Keep `base_url`, `api_key`, and `model` in config, never in code.\n- Aggregators (OpenRouter and similar) exist precisely to make the provider swappable,\n  and their free tiers are enough to prove a system works before you pay anyone.\n- A local server (`ollama`, `vllm`, `llama.cpp`) is the same shape again, so \"run it\n  offline\" costs a URL change rather than a rewrite.\n\nThat is the whole mitigation. When it is one variable, a licensing wall stops being an\narchitectural problem and becomes a procurement preference.\n\n## The trap to name out loud\n\nWanting *one specific branded tool* is almost always wanting one of its capabilities:\nan agent that remembers, enforced session hooks, or unattended loops. All three are\nobtainable from several tools, and from this repo. Pick by capability, not by the brand\non it \u2014 otherwise you end up paying twice for the same model and calling it\nintegration.\n\nRelated: [[Local Runtime Closes The Gaps]], [[Harness Capability Matrix]]\n", "fm": {"created": "2026-08-19", "updated": "2026-08-29", "tags": "[auth, licensing, portability, verified]"}, "links": ["Harness Capability Matrix", "Local Runtime Closes The Gaps"]}, {"name": "Progressive Disclosure", "body": "---\ncreated: 2026-08-29\ntags: [context, skills, architecture]\n---\n\n# Progressive Disclosure\n\nLoad the *index* always and the *content* on demand. This is the single structural\nidea that lets a capability library grow without the context window growing with it.\n\nApplied to skills: only `name` and `description` sit in context at startup. The body\nloads when a request matches the description. Files the body references load only\nwhen the instructions point at them. So a hundred skills cost roughly a hundred\none-line descriptions \u2014 a rounding error \u2014 until one is actually needed.\n\nApplied to memory: `brain/STATE.md` is the always-loaded index (hard ceiling ~60\nlines). Everything colder lives in `brain/wiki/` and is fetched by one deterministic\ncommand. The kernel in `AGENTS.md` deliberately contains **no knowledge** \u2014 it\ncontains the instruction to go get knowledge. See [[Steering as Boot Loader]].\n\nApplied to skill files: a `SKILL.md` that grew past ~150 lines becomes a router\ntable pointing at one file per job, with an explicit instruction to read *only* the\nmatching file. The router gets shorter as the skill gets bigger, which is the\nsignature of the pattern working.\n\n## Why this beats a bigger context window\n\nBigger windows do not fix the problem, because the cost is not only tokens:\n\n- **Attention dilutes.** A model asked to hold ten irrelevant procedures alongside\n  the relevant one follows the relevant one less precisely.\n- **Contradictions compound.** Two skills loaded together can disagree; loaded\n  separately they never meet. See [[Context Rot]].\n- **Cost is per turn, not per session.** An always-included file is re-supplied\n  every single turn.\n\nThe discipline is the same as good software design: a narrow interface, and the\nimplementation behind it. The index is the interface.\n\n## The failure mode it prevents\n\nWithout it, the natural move when an agent lacks context is to add more to the\nalways-on layer. That works for a week and then every session starts with four\nthousand tokens of instructions, most contradicting each other, and the agent\nfollows none of them reliably. The fix is never a bigger preamble \u2014 it is a smaller\nindex pointing at more, better-organised content.\n\n## The rule\n\nAnything in the always-loaded layer must justify its place **on every future\nsession**, not on the one where you added it.\n\nRelated: [[Steering as Boot Loader]], [[Context Rot]], [[Grep Beats Embeddings Here]]\n", "fm": {"created": "2026-08-29", "tags": "[context, skills, architecture]"}, "links": ["Context Rot", "Grep Beats Embeddings Here", "Steering as Boot Loader"]}, {"name": "Provenance Or It Didnt Happen", "body": "---\ncreated: 2026-08-29\ntags: [research, memory, reliability]\n---\n\n# Provenance Or It Didnt Happen\n\nEvery claim in the vault carries where it came from, or it is marked unverified.\nThere is no third category, and \"I'm fairly sure\" is the third category pretending\nto be the first.\n\nThis matters more for an agent's memory than for a human's, because an agent will\nread its own note in six months with **total confidence and no recollection of how\nsure it was when writing it**. A human at least feels the hesitation again. The\nnote is the only place that hesitation can be stored.\n\n## The three states\n\n| State | How it is written | What it licenses |\n|---|---|---|\n| **Verified** | source link, or the command and its output | acting on it |\n| **Measured** | the number, the date, the conditions | acting on it, with the conditions restated |\n| **Unverified** | the words \"not verified\" or \"assumed\", explicitly | reasoning about it, never asserting it |\n\nAn unmarked claim is read as verified. That is why omission is worse than a wrong\nlabel: a wrong label gets corrected, an omission gets inherited.\n\n## What counts as provenance\n\n- A URL, for anything external\n- A file path and line, for anything in the repo\n- A command and its actual output, for anything measured\n- A date, always \u2014 \"913MB RAM\" was true of one instance on one day\n- The conditions, for a measurement \u2014 \"247MB under a 700MB cap while idle\" is a\n  different claim from \"247MB\"\n\n## Layer boundaries are a provenance mechanism\n\n`brain/raw/` exists so that unverified material has somewhere to live that is not\n`brain/wiki/`. The rule \"never cite a raw file as knowledge\" is a provenance rule\nwearing a filing costume: the directory *is* the label.\n\nAn automation that writes directly to `wiki/` destroys this, because the resulting\nnote is indistinguishable from one a human understood and restated. That is why\n`automations/radar.py` writes only to `raw/`, and why distillation is a separate\ndeliberate step.\n\n## The measurement discipline\n\nWhen recording a number, record how it was obtained. \"The app uses 247MB\" is nearly\nuseless in six months. Useful:\n\n> `systemctl show agentos -p MemoryCurrent` \u2192 247MB against a 700MB cap, idle,\n> 2026-08-29, `t3.micro` with a 2GB swapfile.\n\nNow a future reader can tell whether their 400MB reading is a regression or just a\ndifferent workload.\n\n## Why an agent gets this wrong by default\n\nLanguage models are fluent about things they have not checked, and fluency reads as\nconfidence. The mitigation is structural rather than motivational: make the *format*\nrequire provenance, so producing an unsourced claim means leaving a visible hole\nrather than writing a smooth sentence.\n\nRelated: [[Signal Triage]], [[Git Is The Disk]], [[Evals Before Vibes]]\n", "fm": {"created": "2026-08-29", "tags": "[research, memory, reliability]"}, "links": ["Evals Before Vibes", "Git Is The Disk", "Signal Triage"]}, {"name": "Ralph Loop", "body": "---\ncreated: 2026-08-19\ntags: [loops, pattern]\n---\n\n# Ralph Loop\n\nGeoffrey Huntley's pattern, named after Ralph Wiggum: put a coding agent in a\n`while true` loop that re-reads the *same* prompt file every iteration, and let\nthe filesystem and git carry memory between runs. Each iteration starts with a\nclean context window.\n\nWhy it works: agent quality degrades as context fills. Rather than fighting that\nwith bigger windows or clever orchestration, you externalize state and reset\nruthlessly. The plan file, the todo list, and the git history are the memory;\nthe transcript is disposable.\n\nAdapting it to a hosted harness, where the agent cannot re-invoke itself: **the\nledger is the loop counter and the session is the loop body.** `brain/loops/<name>.md` holds\nthe fixed goal, the exit condition, and the checkbox steps. One iteration = read\n`bin/os loop next`, do exactly that step, append findings, tick it, save, stop. A\nlater session \u2014 possibly on another device \u2014 resumes with no re-explaining.\n\nTwo rules that keep it from degenerating:\n\n1. **Steps must be externally verifiable.** \"Fix auth\" is not a step. \"Extract\n   `verifyToken` into `src/auth/token.ts`, tests still pass\" is. Unverifiable\n   steps get ticked optimistically and the loop drifts.\n2. **Two identical failures ends the loop.** Write the blocker into Notes and\n   escalate. Persistence past that point is just expensive hallucination.\n\nDeterministic work still belongs in a real shell loop \u2014 `until npm test; do ...`\n\u2014 because bash repeats for free and doesn't need judgement.\n\nRelated: [[Harness Capability Matrix]], [[Git Is The Disk]]\n", "fm": {"created": "2026-08-19", "tags": "[loops, pattern]"}, "links": ["Git Is The Disk", "Harness Capability Matrix"]}, {"name": "Signal Triage", "body": "---\ncreated: 2026-08-29\ntags: [research, memory, attention]\n---\n\n# Signal Triage\n\nA capture of 87 items contains about two that matter. Triage is the discipline of\nfinding those two and **discarding the rest without guilt**.\n\nThe failure mode is not missing something. It is keeping everything \u2014 which produces\na vault that is expensive to search, full of material nobody read, and\nindistinguishable from a feed.\n\n## The one question\n\n> Does this change a decision I am going to make?\n\nYes \u2192 distil into `brain/wiki/` in your own words, now. Maybe \u2192 leave it in\n`brain/raw/`, it is in git. No \u2192 discard.\n\nAnything that fails this but feels interesting is entertainment. Nothing wrong with\nthat; it does not belong in a second brain.\n\n## Output is graded, never flat\n\n| Grade | Meaning |\n|---|---|\n| **Worth your time** | changes a decision, or invalidates a belief |\n| **Worth knowing about** | you should recognise the name in six months |\n| **Pattern** | true of the capture as a whole, not of any single item |\n| **Skip** | dominated the capture, deserves nothing |\n\n**Pattern is the grade that justifies the exercise.** No individual item contains\nit. Observed on the first real radar run: skills-plus-progressive-disclosure-plus-\ncache-stable-prefixes appearing independently in four unrelated projects in one\nweek. That is worth more than any single link in the capture, and a flat summary\nwould never surface it.\n\n## Absence is a finding\n\nAsk what the capture does *not* contain that it should. The first digest this repo\nproduced noted that nothing in the capture addressed evaluation, failure logging, or\nhuman-in-the-loop review \u2014 \"exactly where a personal OS will silently degrade\". That\nobservation was more actionable than any paper in the capture, and it led directly\nto [[Evals Before Vibes]].\n\nA conspicuous gap means either the field has not solved it, or you are reading the\nwrong sources. Both are worth knowing.\n\n## Counter-signals\n\nLow value, regardless of how it is presented:\n\n- a benchmark number on a benchmark you do not use\n- stars with no recent commits\n- a launch post \u2014 a company existing is not a technical development\n- novelty that is only scale\n- a wrapper around something you already call directly\n\nHigh value, regardless of how boring:\n\n- names a failure mode you have hit or will hit\n- reports a **negative** result, or a limitation the field usually hides\n- shows a mechanism instead of a score\n- contradicts something you currently believe\n- arrives independently from three unrelated directions in one week\n\nThat last pair is why hype-sorted feeds are actively misleading: the strongest signal\navailable is *boring, well-engineered, unglamorous work*, and popularity ranking\nsystematically buries it.\n\n## Anti-hoarding\n\nA `brain/raw/` capture unread for two weeks was not important. Delete it. Every kept\nfile is a tax on every future search, and the instinct to keep things \"just in case\"\nis precisely how a vault becomes a landfill.\n\nRelated: [[Provenance Or It Didnt Happen]], [[Evals Before Vibes]], [[Context Rot]]\n", "fm": {"created": "2026-08-29", "tags": "[research, memory, attention]"}, "links": ["Context Rot", "Evals Before Vibes", "Provenance Or It Didnt Happen"]}, {"name": "Steering as Boot Loader", "body": "---\ncreated: 2026-08-19\nupdated: 2026-08-29\ntags: [pattern, portability]\n---\n\n# Steering as Boot Loader\n\nAn always-included instruction file is injected into context on every interaction. That\nmakes it the closest thing a hosted harness has to a session-start hook \u2014 and in one\nrespect it is strictly better.\n\nA hook fires once, at session start. Its output sits in the transcript and can be dropped\nby context compaction on a long session. An always-included instruction file is re-supplied\nevery turn, so the boot rule survives compaction, an explicit `/compact`, and a session\nresumed on another device.\n\nThe pattern: keep the kernel **small and imperative**. It should not contain knowledge \u2014 it\ncontains the instruction to go get knowledge:\n\n```markdown\nRun `bash bin/os boot` as the first tool call of every session.\nRun `bash bin/os save \"<summary>\"` as the last.\n```\n\nKnowledge lives behind one deterministic command. That keeps the always-on token cost near\nzero while giving the agent a full memory load in a single tool call \u2014 progressive\ndisclosure applied to memory rather than to skills.\n\n## The fallback ladder\n\nDifferent surfaces support different loaders. Same entry point for all of them, so there is\nnever duplicated logic:\n\n| Surface | Loader | Boot is |\n|---|---|---|\n| hosted sandbox | always-included instruction file | instructed |\n| local IDE or CLI | session-start hook running `bin/os boot` | enforced |\n| always-on server | `systemd` timer or `cron` | scheduled |\n| any harness at all | the user typing `bin/os boot` | manual, still works |\n\nEvery rung calls the same script. That is the property that matters: adding a loader is\nnever a rewrite.\n\n## Where the kernel actually lives\n\nThe kernel text belongs in a **neutral** file \u2014 `AGENTS.md` \u2014 and each harness's binding is\ngenerated from it by `adapters/install.sh`. Writing the kernel directly into one vendor's\nconfig path is the mistake [[Binding Beats Building]] describes, one level up: it binds the\nOS to a tool instead of to a capability.\n\nRelated: [[Harness Capability Matrix]], [[Git Is The Disk]], [[Binding Beats Building]]\n", "fm": {"created": "2026-08-19", "updated": "2026-08-29", "tags": "[pattern, portability]"}, "links": ["Binding Beats Building", "Git Is The Disk", "Harness Capability Matrix"]}, {"name": "Taste Is A Checklist", "body": "---\ncreated: 2026-08-29\ntags: [craft, writing, design]\n---\n\n# Taste Is A Checklist\n\nTaste is treated as an innate faculty \u2014 you either have an eye or you don't. That\nframing is useless to an agent, and mostly useless to a person, because it offers\nnothing to do.\n\nThe operational version: **taste is a set of rules specific enough to check.**\n\"Make it beautiful\" cannot be executed. \"No more than two typefaces and one accent\ncolour\" can be verified in ten seconds by looking. Everything worth calling taste\ndecomposes into rules of the second kind \u2014 that decomposition is what\n`config/skills/taste/` is.\n\n## Why this matters for generated work\n\nAn agent has no aesthetic discomfort. It will not wince at a full-width paragraph of\n14px grey-on-grey, because nothing hurts. What it can do is run a checklist that\nsays line length 45\u201390 characters and body contrast \u2265 4.5:1. Externalised rules\nsubstitute for the missing wince.\n\nThis is the same move as the rest of this OS: put the thing in a file because the\nruntime cannot be trusted to hold it. Memory goes in `brain/`, procedure goes in\nskills, and judgement goes in checklists.\n\n## The generative direction\n\nRules do not only filter, they generate. \"Every element must answer a question\"\nproduces a different first draft than \"add a dashboard\" \u2014 you start by asking what\nquestions the user has, and the layout follows. Constraints are a starting point, not\na filter applied at the end.\n\n## The three rules that do most of the work\n\n1. **Delete before you add.** The most common improvement is removal. Slop is\n   additive; craft is subtractive. If a section survives deletion, it should have\n   been deleted.\n2. **Honest beats impressive.** A status pill reading `keyword-only` beats one\n   reading `hybrid` on an index with no vectors. This repo shipped exactly that lie\n   and had to fix it \u2014 see [[Evals Before Vibes]]. Anything that has to mislead to\n   look good is not good.\n3. **Specific beats general.** \"Fast\" is nothing. \"42s full index, 63 vectors, on a\n   913MB box\" is something. Concreteness is the cheapest quality signal there is, and\n   the first thing missing from generated work.\n\n## The slop tells\n\nGenerated work has a recognisable smell, and it is mostly *padding that survives\ndeletion*: opening by restating the request, tricolons everywhere, emoji as headings,\nstacked hedges, \"comprehensive\" and \"seamless\" and \"leverage\", a closing summary of\nwhat was just said, bullet lists where every bullet is the same length, praise for\nthe question.\n\nNone of those are style crimes in isolation. Together they signal text produced to\noccupy space rather than to say something \u2014 which is the actual definition of slop,\nand the reason the fix is always deletion rather than rewriting.\n\n## Draft with nerve, review without mercy\n\nReviewing while drafting produces cautious, shapeless work. Separate the passes:\nwrite the strong version, then run the checklist and cut what fails.\n\nAnd when rejecting your own work, name the rule. \"This feels off\" is not a review;\n\"three of four bullets restate the heading\" is something you can fix.\n\nRelated: [[Progressive Disclosure]], [[Evals Before Vibes]], [[Signal Triage]]\n", "fm": {"created": "2026-08-29", "tags": "[craft, writing, design]"}, "links": ["Evals Before Vibes", "Progressive Disclosure", "Signal Triage"]}], "raw": [{"name": "2026-08-29 research \u2014 context engineering for LLM agents", "body": "---\ncaptured: 2026-08-29\ncaptured_at: 2026-08-29T03:54:57Z\nkind: research\ntopic: context engineering for LLM agents\nsource: automations/research.py\nresults: 18\n---\n\n# Research \u2014 context engineering for LLM agents\n\nGathered from 3 source(s), 18 result(s). **Unverified capture** \u2014 distil into `brain/wiki/` in your own words before relying on any of it.\n\n## hf-papers\n\n- [PILOT in the Loop: Live Self-Improvement for Long-Horizon Agents](https://huggingface.co/papers/2608.26530) \u00b7 **25**\n  Long-horizon agent runs generate experience that can improve both the current run and future work. Most self-improvement methods process this experience only after execution ends, so they cannot redirect the active run or immediately apply and validate lessons learned from it. We argue that self-improvement should inst\n- [Agentic Game Development as a Verifiable Trajectory Data Engine for Scaling World Models](https://huggingface.co/papers/2608.25518) \u00b7 **120**\n  A common strategy for scaling world models is to train on more crawled video with more compute. We argue that this strategy is inefficient: scaling world models also requires a recursive data engine that offers grounded reward signals. The success of code agents illustrates why this matters. As code is executable, comp\n- [GameWAM: A World Action Model for Video Games](https://huggingface.co/papers/2608.26200) \u00b7 **38**\n  Modern video games combine first-person perception, rapid visual changes, persistent world state, and heterogeneous native controls. Existing game agents map visual and task context directly to actions but lack explicit world dynamics modeling, whereas interactive game world models predict visual futures from supplied \n- [CaSKG: Counterfactual-Causal Skill Graphs for Scalable Agent Skill Retrieval](https://huggingface.co/papers/2608.25500) \u00b7 **5**\n  Reusable skill libraries allow large language model (LLM) agents to reuse procedural knowledge across tasks, but they also turn memory access into a challenging retrieval problem. Full-library prompting preserves coverage at high context cost, vector retrieval returns compact neighborhoods but treats skills as independ\n- [Training Agents to Evolve with Their Harness: TaoLive Digital Avatar Agent Technical Report](https://huggingface.co/papers/2608.15763) \u00b7 **43**\n  AI-powered digital avatar streamers must answer product questions, engage viewers, and execute marketing strategies in real time, demanding low latency, frequent strategy updates, and accurate yet effective responses. Evolvable Harnesses, whose Skills, Hooks, prompts, and tools can be updated independently of model wei\n- [CaRGo-T: Causal Reasoning Graph-of-Thought improves Multimodal Humor Comprehension](https://huggingface.co/papers/2608.23172) \u00b7 **6**\n  Large-scale vision-language models (VLMs) have demonstrated remarkable versatility across a wide range of multimodal tasks. However, understanding humor remains challenging because humorous content often depends on subtle interactions among entities, events, context, and implicit relationships across image and text mod\n\n## github\n\n- [Meirtz/Awesome-Context-Engineering](https://github.com/Meirtz/Awesome-Context-Engineering) \u00b7 **3287**\n  \ud83d\udd25 Comprehensive survey on Context Engineering: from prompt engineering to production-grade AI systems. hundreds of papers, frameworks, and implementation guides for LLMs and AI agents.\n- [tigicion/dao-code](https://github.com/tigicion/dao-code) \u00b7 **1255**\n  Open-source TypeScript terminal coding agent for DeepSeek-V4 \u2014 builds on DeepSeek's strong price-performance and ultra-cheap cache pricing, engineering byte-stable prefixes and cache-reusing forks so cross-session memory and a continuous self-correction layer add almost no token cost; 1M context, Skills/MCP/Hooks, Clau\n- [ratel-ai/ratel](https://github.com/ratel-ai/ratel) \u00b7 **429**\n  Context engineering for AI agents. ~80% fewer tokens. Fix tool overload. Skills and memory with in-process BM25 and semantic retrieval. Progressive Disclosure. No vector DB.\n- [yzfly/awesome-context-engineering](https://github.com/yzfly/awesome-context-engineering) \u00b7 **130**\n  A curated collection of resources, papers, tools, and best practices for Context Engineering in AI agents and Large Language Models (LLMs).\n- [rossoctl/context-guru](https://github.com/rossoctl/context-guru) \u00b7 **43**\n  Context engineering manages an agentic system's context: persisting and efficiently retrieving conversations and trajectories for the purpose of optimizing LLM context, this may include compacting and summarizing context to reduce costs and latency while preserving accuracy.\n- [GoogleCloudPlatform/db-context-enrichment](https://github.com/GoogleCloudPlatform/db-context-enrichment) \u00b7 **39**\n  A context engineering agent designed to generate, manage, and optimize structured context sets from your database schemas. It bridges the gap between Large Language Models (LLMs) and databases by compiling, evaluating, and maintaining the precise operational context needed for highly accurate natural language-to-SQL qu\n\n## hackernews\n\n- [Show HN: Geniusrise, an open source framework and ecosystem for AI agents](https://github.com/geniusrise/geniusrise) \u00b7 **9**\n  9 points \u00b7 2 comments\n- [Show HN: No Hype AI \u2013 get oriented in using LLM tools for software engineering](https://nohypeai.dev) \u00b7 **9**\n  9 points \u00b7 0 comments\n- [Show HN: ArchGW \u2013 An intelligent edge and service proxy for agents](https://github.com/katanemo/archgw/) \u00b7 **118**\n  118 points \u00b7 15 comments\n- [Launch HN: Datafruit (YC S25) \u2013 AI for DevOps](https://news.ycombinator.com/item?id=45104974) \u00b7 **65**\n  65 points \u00b7 48 comments\n- [Launch HN: MindFort (YC X25) \u2013 AI agents for continuous pentesting](https://news.ycombinator.com/item?id=44117465) \u00b7 **60**\n  60 points \u00b7 24 comments\n- [Launch HN: TeamOut (YC W22) \u2013 AI agent for planning company retreats](https://app.teamout.com/ai) \u00b7 **55**\n  55 points \u00b7 61 comments\n\n---\n\n## Open questions\n\n- [ ] what does this change about how the OS should work?\n- [ ] which single claim here would be most expensive to be wrong about?\n- [ ] is there an existing note this contradicts? reconcile, don't append.\n", "fm": {"captured": "2026-08-29", "captured_at": "2026-08-29T03:54:57Z", "kind": "research", "topic": "context engineering for LLM agents", "source": "automations/research.py", "results": "18"}, "links": []}, {"name": "2026-08-29 AI radar", "body": "---\ncaptured: 2026-08-29\ncaptured_at: 2026-08-29T03:53:42Z\nkind: radar\nsource: automations/radar.py\nfeeds: [arxiv, github, hackernews, hf-models, hf-papers, lobsters]\nitems: 87\n---\n\n# AI radar \u2014 2026-08-29\n\nAutomated capture. **Unread and unverified** \u2014 this is `raw/`, not knowledge. Distil anything that matters into `brain/wiki/` in your own words, then let this file rot.\n\n## Papers \u2014 Hugging Face daily (community-curated)\n\n- [Agentic Game Development as a Verifiable Trajectory Data Engine for Scaling World Models](https://huggingface.co/papers/2608.25518) \u00b7 **120**\n  A common strategy for scaling world models is to train on more crawled video with more compute. We argue that this strategy is inefficient: scaling world models also requires a recursive data engine that offers grounded reward signals. The success of code agents illustrates why t\n  <sub>[arXiv](https://arxiv.org/abs/2608.25518)</sub>\n- [TTPO: Test-Time Policy Optimization](https://huggingface.co/papers/2608.27448) \u00b7 **65**\n  Recent prominent post-training methods, such as Reinforcement Learning (RL) and On-Policy Self-Distillation (OPSD), have driven rapid progress in mathematical reasoning for large language models, yet their reliance on ground-truth labels precludes test-time training (TTT). Replac\n  <sub>[arXiv](https://arxiv.org/abs/2608.27448)</sub>\n- [GameWAM: A World Action Model for Video Games](https://huggingface.co/papers/2608.26200) \u00b7 **38**\n  Modern video games combine first-person perception, rapid visual changes, persistent world state, and heterogeneous native controls. Existing game agents map visual and task context directly to actions but lack explicit world dynamics modeling, whereas interactive game world mode\n  <sub>[arXiv](https://arxiv.org/abs/2608.26200)</sub>\n- [PILOT in the Loop: Live Self-Improvement for Long-Horizon Agents](https://huggingface.co/papers/2608.26530) \u00b7 **25**\n  Long-horizon agent runs generate experience that can improve both the current run and future work. Most self-improvement methods process this experience only after execution ends, so they cannot redirect the active run or immediately apply and validate lessons learned from it. We\n  <sub>[arXiv](https://arxiv.org/abs/2608.26530)</sub>\n- [Procedura: Agentic 3D Modeling with Procedural Control](https://huggingface.co/papers/2608.26238) \u00b7 **8**\n  Native 3D generators now recover impressive mesh geometry from a single image. However, a dense mesh stays soft where a machined object should be sharp, it carries no part decomposition, and it exposes no parameter a user could edit. To address this, we explore the paradigm of 3D\n  <sub>[arXiv](https://arxiv.org/abs/2608.26238)</sub>\n- [Luce: Relightable Gaussians for 3D Asset Generation](https://huggingface.co/papers/2608.23943) \u00b7 **6**\n  High-fidelity image-to-3D generation requires a 3D representation that captures both geometry and appearance. To support relighting and integration into standard rendering pipelines, the representation should include physically based rendering (PBR) modalities such as albedo, met\n  <sub>[arXiv](https://arxiv.org/abs/2608.23943)</sub>\n- [TacForcing: Streaming Action Generation with Execution-Time Tactile Feedback](https://huggingface.co/papers/2608.25798) \u00b7 **5**\n  Contact-rich manipulation requires adapting to contact states that can evolve substantially within an action horizon. However, chunk-based vision-language-action models predict complete action chunks from observations collected before execution, leaving tactile conditioning stale\n  <sub>[arXiv](https://arxiv.org/abs/2608.25798)</sub>\n- [CritICL: Inference-Time Weak-to-Strong Generalization from Small Language Model Failure Modes](https://huggingface.co/papers/2608.27455) \u00b7 **4**\n  Recent advances in inference-time scaling have significantly improved the reasoning performance of large language models (LLMs). However, these methods typically rely on repeated generation or external verification. To address this limitation, we introduce CritICL, a novel infere\n  <sub>[arXiv](https://arxiv.org/abs/2608.27455)</sub>\n- [Thinking on Shots: Consistent Multi-Shot Video Editing with Agentic Reasoning](https://huggingface.co/papers/2608.26809) \u00b7 **4**\n  While generative AI has significantly advanced video editing, existing methods primarily focus on single-shot or short video clips. Editing long videos with multiple instructions remains a formidable challenge. Naive chunking strategies, e.g., fixed-duration segmentation, often l\n  <sub>[arXiv](https://arxiv.org/abs/2608.26809)</sub>\n- [EditaLive! Unified Character Video Editing for Live Streaming](https://huggingface.co/papers/2608.27123) \u00b7 **3**\n  Conventional video editing primarily focuses on scene-level content, whereas live streaming places greater emphasis on the human subject. However, directly applying existing video-editing methods to human-centric live streaming remains challenging, as they may introduce facial-ex\n  <sub>[arXiv](https://arxiv.org/abs/2608.27123)</sub>\n- [Aphanta: Diagnosing Task-Aligned Image-Edited Intermediates for Multimodal Reasoning](https://huggingface.co/papers/2608.26993) \u00b7 **3**\n  Explicit visual intermediates can help multimodal large language models (MLLMs) externalize spatial evidence and updated visual states, but their utility depends on whether an image editor can faithfully realize the required transformation. We introduce Aphanta, an automated task\n  <sub>[arXiv](https://arxiv.org/abs/2608.26993)</sub>\n- [What Does an Evaluation License? A Commit-Bound Census of Claim-Relative Inference in Inspect Evals](https://huggingface.co/papers/2608.19269) \u00b7 **2**\n  Evaluation artifacts specify a forward computation: a task, scorer, and reported metric. They do not necessarily license the claim attached to that metric because the historical evidence and alternative semantics needed to replay it may be unbound. We formalize this missing claim\n  <sub>[arXiv](https://arxiv.org/abs/2608.19269)</sub>\n\n## Papers \u2014 arXiv (newest)\n\n- [WikiSkill: Compiling Agent Experience into Persistent Knowledge for Skill Evolution](http://arxiv.org/abs/2608.27454v1)\n  Agent skills package specialized knowledge and workflows into reusable resources that extend AI agent capabilities. Recent work automatically discovers such skills from agent experience, which enables agents to progressively adapt through interaction. However, the insights that g\n  <sub>Liyan Tang, Cyrus Rashtchian, Chun-Sung Ferng, Andrew Tomkins</sub>\n- [SWE-Prime: Fewer Trajectories, Better Performance](http://arxiv.org/abs/2608.27449v1)\n  To improve large language models' ability to resolve real-world software issues, prior work has focused on constructing large-scale agent trajectory datasets and performing supervised fine-tuning (SFT) on successful trajectories. However, task success does not guarantee high-qual\n  <sub>Dewu Zheng, Ruizhe Ye, Yanlin Wang, Yang Ye</sub>\n- [From Static to Dynamic: Benchmarking Real-World Code Review with MCR-Bench](http://arxiv.org/abs/2608.27442v1)\n  In real-world software development, code review typically involves iterative interactions between developers and reviewers to improve software quality, making the process costly and time-consuming. Although recent work explores large language models (LLMs) for automated code revi\n  <sub>Dewu Zheng, Yanlin Wang, Xiwen Wang, Kefeng Duan</sub>\n- [RedEvoAgent: Automatic Red-Teaming Agent with Experience-Driven Skill Evolution](http://arxiv.org/abs/2608.27439v1)\n  LLM-based agents are increasingly deployed in product-level execution harnesses, where jailbreaks can trigger harmful tool use and persistent state changes, creating greater risks than unsafe text generation alone. Existing automatic red-teaming methods often rely on fixed attack\n  <sub>Junjie Zhang, Hui Liu, Kecheng Chen, Xianbo Mo</sub>\n- [Mechanistic Reaction Prediction via Discrete Flow Matching on Graph-Structured Electron Occupation](http://arxiv.org/abs/2608.27429v1)\n  Chemical reactions are fundamentally transformations in electron space, yet most machine learning approaches model them either through \\textit{de novo} generation of product molecules or through heuristic graph edits that operate directly on molecular topology. We introduce MAELL\n  <sub>Nguyen Xuan-Vu, Octavian Susanu, Daniel Armstrong, Philippe Schwaller</sub>\n- [Stochastic Estimation of Transduced Language Models](http://arxiv.org/abs/2608.27428v1)\n  Transduced language models (TLMs) compose a pretrained \\emph{source} language model with a functional finite-state transducer to induce a language model over \\emph{target} strings. Computing the probability of a target prefix under a TLM amounts to summing the source-model probab\n  <sub>V\u00e9steinn Sn\u00e6bjarnarson, Samuel Kiegeland, Manuel de Prada Corral, Ryan Cotterell</sub>\n- [Persona-Execution Separation: An Architecture Pattern for Evolving LLM Agents under Execution Audit](http://arxiv.org/abs/2608.27427v1)\n  Large language model (LLM) agents in governed organizations must let the persona (instructions, tone, self-presentation) evolve freely, while keeping execution (stateful, audited work) traceable. A single trust domain does not satisfy both cheaply. We present Persona-Execution Se\n  <sub>Yisen Xi</sub>\n- [Beyond F1: Evaluating Coverage and Failure Recovery in AI Model Security Scanners](http://arxiv.org/abs/2608.27424v1)\n  Static scanners are increasingly used to identify executable or otherwise unsafe content in machine- learning artifacts, yet conventional evaluation metrics characterize only cases where a scanner yields a usable security judgment. We evaluate ModelScan, ModelAudit, and Fickling \n  <sub>Qianlong Lan, Vinothini Pandurangan, Anuj Kaul, Indranil Sanyal</sub>\n- [Learning a Continuous Sepsis Severity Score Without Hour-by-Hour Supervision: A Two-Site Retrospective Study](http://arxiv.org/abs/2608.27421v1)\n  Currently used sepsis severity indices rely on fixed variables and weights established decades ago, which are coarsely discretized and calibrated to a cohort that no longer reflects contemporary critical care. No alternative learned directly from patient trajectories is in routin\n  <sub>Kevin Zhu, Ryan Zhang, Baraa Abed, Tilendra Choudhary</sub>\n- [Boosting LLM Exploration via Weak-Model Guidance in RLVR](http://arxiv.org/abs/2608.27420v1)\n  Reinforcement Learning with Verifiable Rewards (RLVR) significantly improves LLM reasoning but often causes a drop in policy entropy, leading to narrowed reasoning coverage and degraded pass@$k$ for large $k$. While existing methods mitigate this entropy collapse through algorith\n  <sub>Xingyu Shen, Huishuai Zhang, Peng Li, Yinchun
