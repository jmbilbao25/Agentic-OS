 instruction instead.\n- Grep over markdown instead of a vector DB. See [[Grep Beats Embeddings Here]].\n\n## The real runtime is local\nKiro Web can host this OS but cannot make it *persistent* \u2014 no daemon, no cron.\nKiro Crew can, on the user's own hardware, driving `kiro-cli` over ACP so it runs\non the Kiro subscription. Verified: `kirocrew 0.2.0` installs, `doctor` clean.\nSee [[Kiro Crew Is The Local OS]]. Claude Code is a dead end for this \u2014\n[[Claude Code Cannot Use Kiro Models]].\n\n## Next action\n`bin/os loop next go-local`\n", "lessons": "---\nupdated: 2026-08-19\n---\n\n# Lessons\n\nActivation-based: each line names the situation that should fire it. A lesson\nwithout a trigger is a note. Wrong lessons get deleted, not archived.\n\n- When starting any session in this repo \u2192 run `bash bin/os boot` before replying. Because the sandbox starts with no memory of the last session. _(2026-08-19)_\n- When a session produces a decision, lesson, or finished step \u2192 `bin/os save` immediately. Because sandbox teardown discards uncommitted work silently. _(2026-08-19)_\n- When work will outlive one context window \u2192 create a loop ledger instead of trusting the transcript. Because context compaction drops the middle of long sessions. _(2026-08-19)_\n- When reaching for a hook, custom agent, or repo `mcp.json` on Kiro Web \u2192 stop, none of them load; use steering + skills + a shell script. Because Web only reads `.kiro/steering`, `.kiro/skills`, `.kiro/specs`. _(2026-08-19)_\n- When about to add a note that overlaps an existing one \u2192 rewrite the existing note instead. Because two notes disagreeing is worse than one note being stale. _(2026-08-19)_\n- When `gh pr create` or any `gh pr`/`gh issue` subcommand is tempting \u2192 use `gh api` REST instead. Because the GraphQL-backed subcommands always fail in this sandbox. _(2026-08-19)_\n- When the same loop step fails twice \u2192 stop, write the blocker into the ledger's Notes, escalate. Because a third identical attempt produces confident garbage. _(2026-08-19)_\n- When verifying a generated UI \u2192 load it headless and assert on the DOM, don't assume it renders. Because a template typo produces a blank page that looks fine in source. _(2026-08-19)_\n- When a session starts with an empty workspace or no repo bound \u2192 the brain is not missing, it is unclone; run the sidecar clone from the global kernel before claiming no context exists. Because repo-resident steering cannot load in a session bound to no repo. _(2026-08-19)_\n- When the brain needs to be reachable from any session \u2192 keep it in its own repo on the default branch, cloned by the global kernel to a fixed path. Because Kiro Web clones only the default branch of a bound repo and offers no branch picker. _(2026-08-19)_\n- When told to sync personal config to Kiro Web \u2192 upload each .kiro type folder separately (steering, then skills); the folder NAME is what identifies the config type. Because the Cloud configuration picker takes one top-level folder at a time, not a .kiro root. _(2026-08-19)_\n- When the user wants an agent that is persistent like a real OS (daemon, scheduler, survives reboot) \u2192 that is Kiro Crew on their own hardware, not Kiro Web. Because Web has no cron and tears the sandbox down per task; Crew has 'service install' and 'cron'. _(2026-08-19)_\n- When asked to run Kiro's models through Claude Code \u2192 say no and explain the boundary. Because Claude Code authenticates only against Anthropic subscriptions/API keys or Bedrock/Vertex/Foundry, and Anthropic forbids third parties exposing claude.ai login or rate limits. _(2026-08-19)_\n", "loops": [{"name": "go-local", "status": "open", "steps": [[false, "install kiro-cli on the PC and `kiro-cli login` (this is what gives Crew its model access)"], [false, "`curl -fsSL https://download.crew.kiro.dev/cli.sh | sh` \u2014 needs `openssl` present for signature verification"], [false, "`kirocrew setup` from the Agentic-OS clone so project dir is set, then `kirocrew doctor` until clean"], [false, "`kirocrew gateway`, open http://localhost:5476, confirm the dashboard loads"], [false, "`kirocrew service install` so it survives logout and restarts on crash"], [false, "install the Kiro CLI `SessionStart` hook so boot is *enforced*, not merely instructed"], [false, "`kirocrew knowledge` \u2014 ingest `brain/` as a local folder, verify search finds a note"], [false, "`kirocrew cron` \u2014 schedule `bin/os save` nightly so the vault pushes itself"], [false, "`kirocrew cron` \u2014 schedule one `bin/os loop next` advance, confirm unattended progress"], [false, "decide what `brain/lessons.md` keeps vs. what moves to `kirocrew learn add`"], [false, "`kirocrew snapshot` once, confirm restore works, then delete whatever AgentOS code Crew made redundant"]], "body": "---\nloop: go-local\nstatus: open\ncheck: kirocrew doctor\ncreated: 2026-08-19\n---\n\n# Goal\nMove AgentOS from a Kiro Web sandbox onto the user's own machine, where an agentic\nOS can actually be persistent: a daemon that survives logout, a scheduler, enforced\nsession hooks, and a dashboard. Runtime is Kiro Crew driving `kiro-cli` over ACP;\nthe `brain/` vault stays the git-versioned, Obsidian-readable source of truth.\n\n# Done when\n`kirocrew doctor` reports `kiro-cli` found **and logged in**, the gateway runs as a\nservice, a cron job advances a loop unattended, and the `brain/` vault is ingested\ninto Crew's Knowledge Library while still pushing to git.\n\n# Steps\n- [ ] install kiro-cli on the PC and `kiro-cli login` (this is what gives Crew its model access)\n- [ ] `curl -fsSL https://download.crew.kiro.dev/cli.sh | sh` \u2014 needs `openssl` present for signature verification\n- [ ] `kirocrew setup` from the Agentic-OS clone so project dir is set, then `kirocrew doctor` until clean\n- [ ] `kirocrew gateway`, open http://localhost:5476, confirm the dashboard loads\n- [ ] `kirocrew service install` so it survives logout and restarts on crash\n- [ ] install the Kiro CLI `SessionStart` hook so boot is *enforced*, not merely instructed\n- [ ] `kirocrew knowledge` \u2014 ingest `brain/` as a local folder, verify search finds a note\n- [ ] `kirocrew cron` \u2014 schedule `bin/os save` nightly so the vault pushes itself\n- [ ] `kirocrew cron` \u2014 schedule one `bin/os loop next` advance, confirm unattended progress\n- [ ] decide what `brain/lessons.md` keeps vs. what moves to `kirocrew learn add`\n- [ ] `kirocrew snapshot` once, confirm restore works, then delete whatever AgentOS code Crew made redundant\n\n# Notes\n- Verified in the Kiro Web sandbox: Crew 0.2.0 installs and `doctor` runs. `doctor`\n  showed `provider: acp`, `model: auto`, `kiro-cli: not found` \u2014 the sandbox has no\n  signed-in CLI, which is exactly why this loop has to run on the PC.\n- The installer aborts with \"openssl is required to verify the signed manifest\" if\n  openssl is missing. Install it first rather than skipping verification.\n- Windows: native support via CPython 3.12 venv and `python -m kiro_crew gateway`.\n  The OS-level sandbox is Linux/macOS only; everything else works.\n- 24/7 on a server or NAS instead: `ghcr.io/kirodotdev/kirocrew:stable` in Docker,\n  or `kirocrew cloud` for your own EC2. A laptop that sleeps is a poor host for a\n  scheduler.\n- Do not delete anything from `brain/` until the last step. Crew's memory is\n  better at recall; the vault is better at being auditable. Deleting early trades a\n  durable artifact for a database you cannot diff.\n"}, {"name": "harden-agentos", "status": "open", "steps": [[true, "scaffold kernel steering, skills, vault, `bin/os`, dashboard"], [true, "verify `boot`, `selftest`, and `dash` run clean in this sandbox"], [true, "push to a remote and confirm `save` round-trips (this is the durability test)"], [false, "open a fresh Kiro Web session on this repo, boot cold, confirm context loads"], [false, "clone locally, open `brain/` in Obsidian, confirm graph and links resolve"], [false, "enable GitHub Pages on `docs/` and confirm the dashboard renders"], [false, "run one non-trivial task end to end using only loop + save discipline"], [false, "prune whatever turned out to be dead weight \u2014 deletion is a step too"]], "body": "---\nloop: harden-agentos\nstatus: open\ncheck: bash bin/os selftest\ncreated: 2026-08-19\n---\n\n# Goal\nProve every AgentOS subsystem actually survives a real session boundary in Kiro\nWeb, and fix whatever doesn't. The claim under test: a fresh session with zero\nconversation history can reconstruct full working context from `bin/os boot`\nalone, and hand it back off cleanly.\n\n# Done when\n`bash bin/os selftest` passes, and a brand-new session \u2014 no prior transcript \u2014\ncorrectly answers \"what were we doing and what's next?\" using only the boot\noutput, then advances one step of this loop and pushes it.\n\n# Steps\n- [x] scaffold kernel steering, skills, vault, `bin/os`, dashboard\n- [x] verify `boot`, `selftest`, and `dash` run clean in this sandbox\n- [x] push to a remote and confirm `save` round-trips (this is the durability test)\n- [ ] open a fresh Kiro Web session on this repo, boot cold, confirm context loads\n- [ ] clone locally, open `brain/` in Obsidian, confirm graph and links resolve\n- [ ] enable GitHub Pages on `docs/` and confirm the dashboard renders\n- [ ] run one non-trivial task end to end using only loop + save discipline\n- [ ] prune whatever turned out to be dead weight \u2014 deletion is a step too\n\n# Notes\n- 2026-08-19: `boot` output is ~40 lines with a seeded vault. Watch that number as\n  the journal grows; boot prints only the last two entries for that reason.\n- Durability is the one property that cannot be verified inside a single session.\n  Steps 3 and 4 are the real test; everything before them is scaffolding.\n- 2026-08-19: `bin/os save` round-trip confirmed against origin/agentos. Repo creation via the sandbox gateway is blocked (403 REST, GraphQL passthrough refused), so AgentOS ships as a branch/PR on an existing repo.\n- 2026-08-19: step 4 first attempt FAILED \u2014 session had no repo bound, so nothing cloned. Root cause and fix in [[Binding Beats Building]]. Sidecar clone+boot verified from an empty workspace; the remaining half of step 4 is a fresh session *with the global kernel installed*.\n- 2026-08-19: I ticked step 4 without doing it. Untucked. Step 4 requires a fresh session on the user side; no in-session evidence can satisfy it. What IS verified: the exact global-kernel boot command works from an empty workspace against the new repo.\n"}], "journal": [{"name": "2026-08-19", "body": "---\ndate: 2026-08-19\n---\n\n# 2026-08-19\n\n- Researched whether a persistent agentic OS can run inside Kiro. Answer: yes, but\n  only on the primitives Web actually loads \u2014 steering, skills, specs, bash, git.\n- Established the binding constraints. Hooks, custom agents, and repo `mcp.json`\n  are unavailable on Kiro Web; the sandbox is torn down per task. Recorded in\n  [[Kiro Web Capability Matrix]] and [[Git Is The Disk]].\n- Chose `inclusion: always` steering as the boot loader instead of a\n  `SessionStart` hook. Decision and tradeoff written up.\n- Built the runtime: `bin/os` (boot/log/lesson/note/decide/recall/loop/dash/save/\n  selftest), `bin/osutil.py` for parsing and the dashboard, seeded `brain/`.\n- Adapted the Ralph loop to a surface where the agent can't re-invoke itself: the\n  ledger is the loop counter, the session is the loop body. See [[Ralph Loop]].\n- Skipped a vector store. Grep plus a hot `STATE.md` covers retrieval at this\n  scale; reasoning in [[Grep Beats Embeddings Here]].\n- 13:24Z \u2014 pushed to origin/agentos and opened PR #11; dashboard verified rendering in a headless browser (5 notes, 25 wikilinks, tab nav and filter all work)\n- 13:44Z \u2014 cold-boot test failed for a binding reason, not a design one: session had no repo selected, and main has no .kiro since PR #11 is unmerged. Added a self-bootstrapping global kernel for Settings -> Cloud configuration; verified clone+boot from a fully empty workspace.\n- 13:52Z \u2014 migrated the brain from test-repo/agentos into its own private repo jmbilbao25/Agentic-OS on main; global kernel now clones to /projects/sandbox/Agentic-OS with no branch flag\n- 14:03Z \u2014 clarified cloud config: UI takes one .kiro-type folder at a time, name-identified. Restructured so cloud-config/{steering,skills} hold the real files and .kiro/ symlinks into them - one source of truth. Added Android upload path since the phone picker blocks Download/ and storage root.\n- 14:15Z \u2014 researched and TESTED the local path: installed Claude Code (v2.1.235, refuses without Anthropic auth) and Kiro Crew (0.2.0, doctor clean, provider=acp via kiro-cli). Crew closes every gap Web could not: cron, service install, spawn, run <spec>, six-layer memory with FAISS, dashboard, snapshot/restore. Opened the go-local loop.\n"}], "notes": [{"name": "Binding Beats Building", "body": "---\ncreated: 2026-08-19\ntags: [kiro, constraints, postmortem]\n---\n\n# Binding Beats Building\n\nFirst cold-boot test failed. A fresh Kiro Web session asked \"what are we doing?\"\nand answered \"nothing \u2014 empty workspace, no prior context.\" The OS was fine. The\nsession was never bound to anything containing it.\n\nTwo independent causes, both about delivery rather than design:\n\n1. **No repo selected.** Kiro Web clones repos server-side at session creation. No\n   repo \u2192 no clone \u2192 no `.kiro/steering/` \u2192 no kernel \u2192 no boot. The kernel cannot\n   bootstrap itself from a repo it was never given.\n2. **Wrong branch even if selected.** Web clones the *default* branch and offers no\n   branch picker. The OS lived on an unmerged branch, so `main` had no `.kiro/` at\n   all. A repo-bound session would still have booted empty.\n\nThe general lesson: **a config-file OS is only as persistent as its delivery\nmechanism.** Steering-as-kernel gives you persistence *within a bound repo*; it\ngives you nothing in a session bound to nothing. Those are different guarantees\nand it is easy to conflate them.\n\nThe fix is a second kernel at a scope above the repo. Kiro Web's **Cloud\nconfiguration** (Settings \u2192 Cloud configuration) injects personal steering into\nevery web sandbox regardless of repo \u2014 confirmed by watching a repo-less session\nlog \"Fetching your cloud config\" and apply personal steering with an empty\nworkspace. That kernel has to be **self-bootstrapping**: it can't reference\n`bin/os` because in a repo-less sandbox no such file exists yet. So it carries the\nclone command and treats the brain as a sidecar repo with its own remote.\n\nVerified: from a completely empty `/projects/sandbox`, a shallow clone of the\nbrain branch followed by `bin/os boot` reconstructs full working memory. One\ncommand, no repo binding, ~2 seconds.\n\nCorollary worth keeping: the sidecar model is *better* than the repo-resident\nmodel for cross-project memory. A brain that lives in its own repo and is cloned\ninto whatever sandbox needs it accumulates lessons across every project, instead\nof one silo per repo.\n\nRelated: [[Kiro Web Capability Matrix]], [[Git Is The Disk]], [[Steering as Boot Loader]]\n", "links": ["Git Is The Disk", "Kiro Web Capability Matrix", "Steering as Boot Loader"]}, {"name": "Claude Code Cannot Use Kiro Models", "body": "---\ncreated: 2026-08-19\ntags: [claude-code, auth, verified]\n---\n\n# Claude Code Cannot Use Kiro Models\n\nTested directly: `npm i -g @anthropic-ai/claude-code` installs fine (v2.1.235) and\nthen says `Not logged in \u00b7 Please run /login`. There is no supported way to point it\nat a Kiro subscription.\n\n## What Claude Code will authenticate against\n\n- A Claude Pro or Max subscription (OAuth login)\n- An Anthropic Console API key (`ANTHROPIC_API_KEY`, `sk-ant-\u2026`)\n- Claude for Teams/Enterprise with SSO\n- Cloud providers: Amazon Bedrock, Google Vertex AI, Microsoft Foundry\n\nThat's the complete list. Kiro's entitlement is not any of them \u2014 it isn't an\nAnthropic-compatible endpoint, and Anthropic's Agent SDK documentation states\nplainly that third-party developers are not permitted to offer claude.ai login or\nrate limits for their products. So \"use my Kiro Opus quota in Claude Code\" is not a\nmissing feature, it's a licensing boundary. Anything that appears to do it is\neither a proxy that violates terms or a paid gateway reselling tokens.\n\n## The two legitimate ways to run Claude Code locally\n\n1. **Your own Anthropic account** \u2014 Pro/Max subscription or a Console API key.\n2. **Your own AWS Bedrock access** \u2014 `CLAUDE_CODE_USE_BEDROCK=1` plus AWS\n   credentials. Kiro is an AWS product, but a Kiro subscription is *not* Bedrock\n   model access; that's separate provisioning and separate billing.\n\n## Why you don't need it\n\n`kiro-cli` already runs Kiro's models \u2014 Opus included \u2014 locally on your machine\nunder the subscription you already pay for, and unlike Kiro Web it supports hooks,\ncustom agents, global `~/.kiro/` config, and real shell loops.\n[[Kiro Crew Is The Local OS]] then wraps `kiro-cli` over ACP and adds the\nscheduler, daemon, memory, and dashboard.\n\nWanting \"Claude Code specifically\" is usually wanting one of: a local agent that\nremembers (Crew does it better), enforced session hooks (Kiro CLI has them), or\nunattended loops (`kirocrew cron` and `kirocrew run`). Pick the tool by the\ncapability, not by the brand on it.\n\nRelated: [[Kiro Crew Is The Local OS]], [[Kiro Web Capability Matrix]]\n", "links": ["Kiro Crew Is The Local OS", "Kiro Web Capability Matrix"]}, {"name": "Git Is The Disk", "body": "---\ncreated: 2026-08-19\ntags: [kiro, persistence]\n---\n\n# Git Is The Disk\n\nKiro Web's documented sandbox lifecycle is: provision \u2192 clone repos \u2192 configure \u2192\nexecute \u2192 **tear down**. Elsewhere the docs say a session's file state persists in\nthe cloud. Those two statements are never reconciled, and sessions are deleted\nafter 90 days regardless.\n\nSo the safe model, and the one this OS is built on: **the sandbox filesystem is a\nscratch disk, and the git remote is storage.** A thought that isn't pushed didn't\nhappen.\n\nPractical consequences:\n\n- `bin/os save` is part of the workflow, not a chore at the end. It runs after\n  every durable decision.\n- The vault lives *inside the repo* (`brain/`), not in a home directory or a\n  config folder outside the clone. Anything outside the clone is presumed lost.\n- Commit granularity is the memory granularity: `git log brain/` is a legible\n  history of what the agent learned and when. `git blame brain/lessons.md` shows\n  when a lesson was learned and which session learned it.\n- This is also the sync mechanism for humans: clone the repo locally, open\n  `brain/` in Obsidian, and the Obsidian Git plugin round-trips edits back.\n\nThe upside of the constraint: memory is diffable, reviewable in a PR, and\nrevertable. A `brain/` change can be rejected in code review \u2014 which is a\nproperty no vector store has.\n\nRelated: [[Kiro Web Capability Matrix]], [[Grep Beats Embeddings Here]]\n", "links": ["Grep Beats Embeddings Here", "Kiro Web Capability Matrix"]}, {"name": "Grep Beats Embeddings Here", "body": "---\ncreated: 2026-08-19\ntags: [memory, retrieval]\n---\n\n# Grep Beats Embeddings Here\n\nRetrieval over this vault is `rg`, not a vector database. Not because semantic\nsearch is bad, but because at this scale the ranking gain doesn't pay for the\nmachinery.\n\nWhat a vector store would add: an embedding service, an index that must be\nrebuilt when notes change, a similarity threshold to tune, a process to run, and\na silent failure mode where the index is stale and recall quietly degrades.\n\nWhat grep costs: nothing. It is exact, instant on thousands of files, and its\nfailure mode is honest \u2014 zero hits means zero hits.\n\nThe structure does the work that embeddings would otherwise do:\n\n- `STATE.md` is a hot cache \u2014 the highest-value context is already loaded, so most\n  queries never need retrieval at all.\n- `[[wikilinks]]` are a hand-built relevance graph. Following links from one hit\n  finds the neighbours a similarity search would surface.\n- Atomic notes with descriptive filenames make filename matching a decent first\n  pass on its own.\n\nWhen to revisit: a vault in the thousands of notes where you routinely search for\na *concept* you can't name a keyword for. Then add semantic search as a second\npass over grep, keeping markdown as the source of truth so the index stays\ndisposable.\n\nRelated: [[Git Is The Disk]], [[Kiro Web Capability Matrix]]\n", "links": ["Git Is The Disk", "Kiro Web Capability Matrix", "wikilinks"]}, {"name": "Kiro Crew Is The Local OS", "body": "---\ncreated: 2026-08-19\ntags: [kiro, crew, local, verified]\n---\n\n# Kiro Crew Is The Local OS\n\nEvery gap documented in [[Kiro Web Capability Matrix]] \u2014 no enforced boot, no cron,\nno daemon, no custom agents \u2014 is closed by **Kiro Crew**, which is official,\nopen source, and runs on your own hardware. Installed and verified in the sandbox:\n`kirocrew 0.2.0`, `kirocrew doctor` clean.\n\n## What it actually is\n\nAn open-source personal agent that runs locally or remotely, persistent and\nself-learning, reachable from a Mac/Linux desktop app, a web dashboard at\n`localhost:5476`, a CLI, and channels like Slack, Discord, and Telegram.\n\nIt drives the LLM through **`kiro-cli` over the Agent Client Protocol** \u2014 that is\nthe *only* provider (`agent.provider = acp`, confirmed by `doctor`). So it runs on\nyour Kiro subscription and Kiro's models. No Anthropic key needed, see\n[[Claude Code Cannot Use Kiro Models]].\n\n## The subcommands that matter\n\nVerified present in `kirocrew --help`:\n\n| Command | Closes which gap |\n|---|---|\n| `cron` | scheduled jobs \u2014 the daemon Web could never have |\n| `service install` | runs 24/7, survives logout, restarts on crash |\n| `spawn` | background subagents |\n| `run <spec>` | autonomous task from a spec file \u2014 unattended loops |\n| `learn add/list/remove` | lessons as a first-class API |\n| `memory`, `knowledge` | six-layer memory + curated document store |\n| `snapshot` / `restore` | portable backup of all state |\n| `cloud` | run it on your own EC2 |\n| `agent`, `workspace`, `app` | custom agents, workspaces, installable apps |\n\n## Its memory model vs. ours\n\nCrew ships a genuinely more sophisticated memory system than `brain/`:\n\n- Six layers \u2014 preferences, projects, tiered-decay history, semantic key-value in\n  SQLite, episodic with FAISS vector search, and lessons.\n- Episodic scoring is `cosine \u00d7 (0.7 + 0.3 \u00d7 importance) \u00d7 exp(-0.03 \u00d7 days)`, with\n  MMR diversity reranking. 50% decay at ~23 days.\n- Confidence gating: LLM writes need \u2265 0.8, user-explicit writes always win.\n- Consolidation runs automatically at 30 messages and after 3h idle.\n- Lessons cap at 50 entries and are injected as a distinct \"always follow these\"\n  block \u2014 the same activation-based idea as `brain/lessons.md`, enforced by the\n  runtime instead of by a steering file.\n- Embeddings are local and automatic (~610 MB model, downloads on first start),\n  with keyword fallback until it lands.\n\nSo Crew's memory supersedes hand-rolled recall. What it does *not* supersede is a\n**human-readable, git-versioned, Obsidian-native vault**. Crew's state lives in\nSQLite under `~/.kiro/crew/`; ours is diffable markdown reviewable in a PR. Those\nare complementary, and Crew has the seam for it: the Knowledge Library ingests\n**local folders recursively**, so point it at `brain/` and the vault becomes\nsearchable inside Crew without giving up git as the source of truth.\n\n## Why this doesn't invalidate the vault\n\nThe vault stays the durable, portable, auditable layer \u2014 it survives Crew, works in\nObsidian, and reviews in a PR. Crew becomes the runtime that was missing: enforced\nboot via hooks, a scheduler, a daemon, and a dashboard nobody had to hand-write.\n\nRelated: [[Kiro Web Capability Matrix]], [[Git Is The Disk]], [[Claude Code Cannot Use Kiro Models]], [[Ralph Loop]]\n", "links": ["Claude Code Cannot Use Kiro Models", "Git Is The Disk", "Kiro Web Capability Matrix", "Ralph Loop"]}, {"name": "Kiro Web Capability Matrix", "body": "---\ncreated: 2026-08-19\ntags: [kiro, constraints]\n---\n\n# Kiro Web Capability Matrix\n\nKiro Web runs the same agent harness as the IDE and CLI, but only a subset of the\nconfig surface loads \u2014 which dictates the entire design of this OS.\n\n| Primitive | Kiro Web | Notes |\n|---|---|---|\n| `.kiro/steering/*.md` | \u2705 | all four inclusion modes; arrives with the repo clone |\n| `.kiro/skills/*/SKILL.md` | \u2705 | activation works; slash-commands and import \"coming soon\" |\n| `.kiro/specs/*/` | \u2705 | wave-based parallel task execution, resumable |\n| bash + runtimes + internet | \u2705 | Python, Node, Go, Rust, etc.; open internet |\n| built-in subagents | \u2705 | context-gathering and general-purpose only |\n| `.kiro/hooks/*.json` | \u274c | every trigger unsupported on Web |\n| `.kiro/agents/*.json` | \u274c | built-in agents only |\n| repo `.kiro/settings/mcp.json` | \u274c | configure MCP in Settings \u2192 Agent instead |\n| `~/.kiro/` global scope | \u274c | no local filesystem; use Cloud configuration |\n\nThe consequences that matter:\n\n1. **No `SessionStart` hook** \u2192 the boot sequence cannot be automated by the\n   platform. An `inclusion: always` steering file is the substitute; it is\n   re-read every turn, which makes it more compaction-proof than a hook anyway.\n   See [[Steering as Boot Loader]].\n2. **No custom agents** \u2192 no per-role tool restrictions or model routing on Web.\n   Roles have to be skills the one agent loads, not separate agents.\n3. **Sandbox is per-task and torn down** \u2192 [[Git Is The Disk]].\n4. **Cloud configuration** (Settings \u2192 Cloud configuration) syncs personal\n   steering and skills into every web sandbox, which is how the kernel follows\n   you into repos that don't contain it.\n\nRelated: [[Steering as Boot Loader]], [[Git Is The Disk]], [[Ralph Loop]]\n", "links": ["Git Is The Disk", "Ralph Loop", "Steering as Boot Loader"]}, {"name": "Ralph Loop", "body": "---\ncreated: 2026-08-19\ntags: [loops, pattern]\n---\n\n# Ralph Loop\n\nGeoffrey Huntley's pattern, named after Ralph Wiggum: put a coding agent in a\n`while true` loop that re-reads the *same* prompt file every iteration, and let\nthe filesystem and git carry memory between runs. Each iteration starts with a\nclean context window.\n\nWhy it works: agent quality degrades as context fills. Rather than fighting that\nwith bigger windows or clever orchestration, you externalize state and reset\nruthlessly. The plan file, the todo list, and the git history are the memory;\nthe transcript is disposable.\n\nAdapting it to Kiro Web, where the agent cannot re-invoke itself: **the ledger is\nthe loop counter and the session is the loop body.** `brain/loops/<name>.md` holds\nthe fixed goal, the exit condition, and the checkbox steps. One iteration = read\n`bin/os loop next`, do exactly that step, append findings, tick it, save, stop. A\nlater session \u2014 possibly on another device \u2014 resumes with no re-explaining.\n\nTwo rules that keep it from degenerating:\n\n1. **Steps must be externally verifiable.** \"Fix auth\" is not a step. \"Extract\n   `verifyToken` into `src/auth/token.ts`, tests still pass\" is. Unverifiable\n   steps get ticked optimistically and the loop drifts.\n2. **Two identical failures ends the loop.** Write the blocker into Notes and\n   escalate. Persistence past that point is just expensive hallucination.\n\nDeterministic work still belongs in a real shell loop \u2014 `until npm test; do ...`\n\u2014 because bash repeats for free and doesn't need judgement.\n\nRelated: [[Kiro Web Capability Matrix]], [[Git Is The Disk]]\n", "links": ["Git Is The Disk", "Kiro Web Capability Matrix"]}, {"name": "Steering as Boot Loader", "body": "---\ncreated: 2026-08-19\ntags: [kiro, pattern]\n---\n\n# Steering as Boot Loader\n\nA steering file with `inclusion: always` is injected into context on every\ninteraction. That makes it the closest thing Kiro Web has to a `SessionStart`\nhook \u2014 and in one respect it is strictly better.\n\nA hook fires once, at session start. Its output sits in the transcript and can be\ndropped by context compaction on a long session. An always-included steering file\nis re-supplied every turn, so the boot rule survives compaction, `/compact`, and\na session resumed on another device.\n\nThe pattern: keep the kernel file **small and imperative**. It should not contain\nknowledge \u2014 it contains the instruction to go get knowledge:\n\n```markdown\n---\ninclusion: always\n---\nRun `bash bin/os boot` as the first tool call of every session.\nRun `bash bin/os save \"<summary>\"` as the last.\n```\n\nKnowledge lives behind one deterministic command. That keeps the always-on token\ncost near zero while giving the agent a full memory load in a single tool call \u2014\nprogressive disclosure applied to memory rather than to skills.\n\nFallback ladder for other surfaces: IDE and CLI *do* support hooks, so ship a\n`SessionStart` hook that runs the same `bin/os boot` (stdout on exit 0 is\ninjected into context). Same entry point, two loaders, no duplicated logic.\n\nRelated: [[Kiro Web Capability Matrix]], [[Git Is The Disk]]\n", "links": ["Git Is The Disk", "Kiro Web Capability Matrix"]}], "decisions": [{"name": "2026-08-19 Steering as the boot loader", "body": "---\ndate: 2026-08-19\nstatus: accepted\n---\n\n# Steering as the boot loader\n\n## Context\nThe OS needs a deterministic boot on every session: load working memory, open\nloops, and lessons before doing any work. On Kiro IDE and CLI this is a\n`SessionStart` hook, whose stdout is injected into context on exit 0. On Kiro Web\nhooks do not run at all.\n\n## Decision\nPut the boot instruction in `.kiro/steering/00-kernel.md` with\n`inclusion: always`, pointing at a single command (`bash bin/os boot`). Ship the\nequivalent `SessionStart` hook in `.kiro/hooks/` for IDE and CLI users, calling\nthe same script. One entry point, two loaders.\n\n## Tradeoff\nWhat this costs us: the boot is *instructed*, not *enforced*. A sufficiently\ndistracted agent can skip it, where a hook is mechanical. Accepted because the\nalternative on Web is no boot at all, and because an always-included steering\nfile has a compensating advantage \u2014 it is re-supplied every turn, so it survives\ncontext compaction that would drop a hook's one-time output.\n\n## Alternatives rejected\n- **Hook only** \u2014 silently does nothing on Web, which is the primary surface here.\n- **Inline the memory into steering** \u2014 puts the entire vault in the context\n  window every turn. Defeats the layering and scales terribly.\n- **A custom agent with `resources`** \u2014 custom agents are unavailable on Web.\n"}]}</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const md = s => marked.parse((s||'').replace(/^---[\s\S]*?\n---\n/, '')
  .replace(/\[\[([^\]|]+)\]\]/g, (_,n)=>`<span class="wl" data-go="${n}">${n}</span>`));
document.getElementById('meta').textContent =
  `generated ${D.generated} · ${D.notes.length} notes · ${D.decisions.length} decisions · ` +
  `${D.loops.filter(l=>l.status==='open').length} open loops`;

const views = {
  Overview(){
    const open = D.loops.filter(l=>l.status==='open');
    return card('WORKING MEMORY', md(D.state))
      + (open.length ? open.map(loopCard).join('') : card('LOOPS','<p class="dim">no open loops</p>'))
      + card('LESSONS', md(D.lessons))
      + (D.journal[0] ? card('LATEST JOURNAL — '+D.journal[0].name, md(D.journal[0].body)) : '');
  },
  Loops(){ return D.loops.length ? D.loops.map(loopCard).join('') : '<p class="dim">no loops</p>'; },
  Notes(){
    return `<div class="card"><input id="q" placeholder="filter notes…" size="30"></div>`
      + `<div id="notes">` + D.notes.map(n =>
        `<div class="card note" data-n="${n.name.toLowerCase()}" id="n-${cssid(n.name)}">
           <h3>${n.name}</h3>${md(n.body)}
           ${n.links.length?`<p class="dim">links: ${n.links.map(l=>`<span class="wl" data-go="${l}">${l}</span>`).join(', ')}</p>`:''}
         </div>`).join('') + `</div>`;
  },
  Decisions(){ return D.decisions.map(d=>card(d.name, md(d.body))).join('') || '<p class="dim">none</p>'; },
  Journal(){ return D.journal.map(j=>`<details class="card" open><summary>${j.name}</summary>${md(j.body)}</details>`).join('') || '<p class="dim">none</p>'; },
};
function card(t,b){ return `<div class="card"><h3>${t}</h3>${b}</div>`; }
function cssid(s){ return s.replace(/[^a-z0-9]/gi,'-').toLowerCase(); }
function loopCard(l){
  const done = l.steps.filter(s=>s[0]).length, pct = l.steps.length ? done/l.steps.length*100 : 0;
  return `<div class="card"><h3>LOOP · ${l.name} <span class="dim">${l.status} · ${done}/${l.steps.length}</span></h3>
    <div class="bar"><i style="width:${pct}%"></i></div>${md(l.body)}</div>`;
}
let cur = 'Overview';
function render(){
  document.getElementById('nav').innerHTML = Object.keys(views)
    .map(k=>`<button class="${k===cur?'on':''}" data-v="${k}">${k}</button>`).join('');
  document.getElementById('app').innerHTML = views[cur]();
}
document.addEventListener('click', e => {
  const v = e.target.dataset.v, go = e.target.dataset.go;
  if (v) { cur = v; render(); }
  if (go) { cur = 'Notes'; render();
    const el = document.getElementById('n-'+cssid(go));
    el ? el.scrollIntoView({behavior:'smooth'}) : alert('No note yet: '+go); }
});
document.addEventListener('input', e => {
  if (e.target.id !== 'q') return;
  const q = e.target.value.toLowerCase();
  document.querySelectorAll('.note').forEach(n =>
    n.classList.toggle('hide', !n.dataset.n.includes(q)));
});
render();
</script>
