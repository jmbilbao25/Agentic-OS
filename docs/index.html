alem Robotics (YC S26) \u2013 Software for industrial inspection robots](https://news.ycombinator.com/item?id=49466715) \u00b7 **47**\n  47 points \u00b7 31 comments\n  <sub>[HN](https://news.ycombinator.com/item?id=49466715)</sub>\n- [Analyzing student votes across AI models for college essay help](https://studyarena.com/blog/chatgpt-vs-claude-vs-gemini-college-essays-2026) \u00b7 **43**\n  43 points \u00b7 86 comments\n  <sub>[HN](https://news.ycombinator.com/item?id=49443871)</sub>\n- [Getting video models to learn better, faster](https://www.linum.ai/field-notes/data-filtering-gen-video) \u00b7 **36**\n  36 points \u00b7 11 comments\n  <sub>[HN](https://news.ycombinator.com/item?id=49458502)</sub>\n- [Fewer Americans Pay to Use LLMs Than Still Pay to Play World of Warcraft](https://wjamesau.substack.com/p/fewer-americans-pay-to-use-chatgpt) \u00b7 **27**\n  27 points \u00b7 15 comments\n  <sub>[HN](https://news.ycombinator.com/item?id=49469753)</sub>\n\n## Discussion \u2014 Lobsters\n\n- [Robot comment classifier](https://entropicthoughts.com/ai-comment-classifier) \u00b7 **8**\n  8 points \u00b7 5 comments\n- [The Limits of AI (1985)](https://www.youtube.com/watch?v=ePsQksj99LM) \u00b7 **8**\n  8 points \u00b7 4 comments\n- [Bongard Problems](https://matthodges.com/posts/2026-08-19-bongard-problems/) \u00b7 **6**\n  6 points \u00b7 1 comments\n- [social media rabbit holes, clusters, and the relative mixing times of random walks](https://notes.hella.cheap/twitter-isnt-a-town-square-its-a-high-school-cafeteria.html) \u00b7 **6**\n  6 points \u00b7 0 comments\n- [Super-intelligence or Superstition? Exploring Psychological Factors Influencing Belief in AI Predictions about Personal Behavior](https://arxiv.org/abs/2408.06602) \u00b7 **5**\n  5 points \u00b7 0 comments\n- [Are Latent Reasoning Models Easily Interpretable?](https://arxiv.org/abs/2604.04902) \u00b7 **3**\n  3 points \u00b7 0 comments\n- [AscendNPU-IR: MLIR for Ascend](https://gitcode.com/Ascend/AscendNPU-IR) \u00b7 **1**\n  1 points \u00b7 0 comments\n- [Categorization with NLP](https://softwaremaniacs.org/blog/2026/07/30/categorization-with-nlp/) \u00b7 **1**\n  1 points \u00b7 1 comments\n- [The 'Breaking' News: The OpenAI\u2013Hugging Face Incident](https://youtu.be/87DyyMV0kCY) \u00b7 **0**\n  0 points \u00b7 8 comments\n- [Why Do Cognitive Scientists Hate LLMs? (2023)](https://minihf.com/posts/2023-10-16-hermes-lecture-3-why-do-cognitive-scientists-hate-llms/) \u00b7 **0**\n  0 points \u00b7 0 comments\n\n---\n\n## Triage\n\n- [ ] anything here that changes how the OS should work \u2192 `bin/os note \"<Title>\"` and write it in your own words\n- [ ] anything that only *might* matter \u2192 leave it here, it will be in git history if you need it\n- [ ] nothing worth keeping \u2192 delete this file, that is a valid outcome\n", "fm": {"captured": "2026-08-29", "captured_at": "2026-08-29T03:53:42Z", "kind": "radar", "source": "automations/radar.py", "feeds": "[arxiv, github, hackernews, hf-models, hf-papers, lobsters]", "items": "87"}, "links": []}], "output": [{"name": "2026-08-29 AI digest", "body": "---\ncreated: 2026-08-29\nstatus: draft\nchannel: internal\nkind: digest\nsource_capture: 2026-08-29 research \u2014 context engineering for LLM agents\nmodel: z-ai/glm-5.2:free\n---\n\n# AI digest \u2014 2026-08-29\n\nDistilled from `brain/raw/2026-08-29 research \u2014 context engineering for LLM agents.md` (? items) by `automations/distill.py`. Machine-written triage: trust the links, verify the claims.\n\n## Worth your time\n- [PILOT in the Loop: Live Self-Improvement for Long-Horizon Agents](https://huggingface.co/papers/2608.26530) \u2014 In-run experience feedback closes the gap between offline self-improvement and live reroute, which is the bit a personal agent OS has to actually do between scheduled routines.\n- [CaSKG: Counterfactual-Causal Skill Graphs for Scalable Agent Skill Retrieval](https://huggingface.co/papers/2608.25500) \u2014 Treats your skill library as a graph with causal edges, not a flat embedding, so a second brain can pick a sequence of skills instead of one nearest neighbour and avoid the \"one retrieved skill\" failure mode.\n- [tigicion/dao-code](https://github.com/tigicion/dao-code) \u2014 Byte-stable prefixes plus DeepSeek's cache pricing turn cross-session memory into an almost-free append; this is the practical recipe for cheap continuous memory in a markdown second brain.\n- [ratel-ai/ratel](https://github.com/ratel-ai/ratel) \u2014 In-process BM25 plus progressive disclosure plus no vector DB is the architecture that maps onto a git-backed note store with hybrid search, instead of forcing a separate vector service.\n\n## Worth knowing about\n- [Meirtz/Awesome-Context-Engineering](https://github.com/Meirtz/Awesome-Context-Engineering) \u2014 the survey, treat as a reference index not a read.\n- [Training Agents to Evolve with Their Harness: TaoLive Digital Avatar Agent Technical Report](https://huggingface.co/papers/2608.15763) \u2014 Skills/Hooks/prompts as independently updatable surfaces of a harness, separable from the model.\n- [rossoctl/context-guru](https://github.com/rossoctl/context-guru) \u2014 compacting and summarising trajectories, the same problem your scheduled routines will hit.\n- [GoogleCloudPlatform/db-context-enrichment](https://github.com/GoogleCloudPlatform/db-context-enrichment) \u2014 narrow case of context engineering for schema-to-SQL, unlikely to fit a personal brain.\n- [Show HN: ArchGW \u2013 An intelligent edge and service proxy for agents](https://github.com/katanemo/archgw/) \u2014 proxy for tool/LLM calls; relevant only if you start exposing your OS to non-local agents.\n- [Agentic Game Development as a Verifiable Trajectory Data Engine for Scaling World Models](https://huggingface.co/papers/2608.25518) \u2014 the data-engine idea, not the games.\n\n## Patterns\n- Skills plus progressive disclosure plus cache-stable prompts is the same recipe showing up in four independent projects (ratel, dao-code, TaoLive harness, CaSKG); this is becoming the de facto shape of an agent OS and your hybrid-search second brain should adopt the \"graph of skills behind a disclosure layer\" model rather than treating notes as flat chunks.\n- \"Context engineering\" is consolidating into a small set of mechanical primitives \u2014 compaction, prefix stability, BM25-plus-semantic retrieval, skill graphs \u2014 and away from prompt-craft; if your routines still spend tokens on raw history, you are paying for a problem the rest of the field has already engineered around.\n- The capture is missing anything on evaluation, failure logging, or human-in-the-loop review for personal agents, which is conspicuous given that is exactly where a personal OS will silently degrade without it.\n\n## Skip\n- Three of the six HN items are generic YC launches (Datafruit, MindFort, TeamOut) with no specific link to context engineering or personal knowledge systems; ignore the launch noise and keep only ArchGW if you go networked.\n\n---\nDrew on: `brain/raw/2026-08-29 research \u2014 context engineering for LLM agents.md`\n", "fm": {"created": "2026-08-29", "status": "draft", "channel": "internal", "kind": "digest", "source_capture": "2026-08-29 research \u2014 context engineering for LLM agents", "model": "z-ai/glm-5.2:free"}, "links": []}], "decisions": [{"name": "2026-08-19 Steering as the boot loader", "body": "---\ndate: 2026-08-19\nupdated: 2026-08-29\nstatus: accepted\n---\n\n# Steering as the boot loader\n\n## Context\nThe OS needs a deterministic boot on every session: load working memory, open loops,\nand lessons before doing any work. Local IDEs and CLIs generally support a\nsession-start hook, whose stdout is injected into context on exit 0. Hosted\nsandboxes generally do not run hooks at all \u2014 and that is the primary surface here.\n\n## Decision\nPut the boot instruction in an **always-included instruction file** pointing at a\nsingle command (`bash bin/os boot`). Ship an equivalent session-start hook for\nsurfaces that support one, calling the same script. One entry point, many loaders.\n\nThe kernel text lives in `AGENTS.md`; per-harness bindings are generated from it by\n`adapters/install.sh` rather than authored separately.\n\n## Tradeoff\nWhat this costs us: the boot is *instructed*, not *enforced*. A sufficiently\ndistracted agent can skip it, where a hook is mechanical. Accepted because the\nalternative on a hosted surface is no boot at all, and because an always-included\nfile has a compensating advantage \u2014 it is re-supplied every turn, so it survives\ncontext compaction that would drop a hook's one-time output.\n\nSecond cost, accepted 2026-08-29: generated bindings can drift from the kernel.\nMitigated by a `selftest` check that fails on drift and names `adapters/install.sh`\nas the fix, rather than by trusting anyone to remember.\n\n## Alternatives rejected\n- **Hook only** \u2014 silently does nothing on hosted surfaces, which is where this runs.\n- **Inline the memory into the kernel** \u2014 puts the entire vault in the context window\n  every turn. Defeats the layering and scales terribly.\n- **A custom sub-agent with preloaded resources** \u2014 unavailable on hosted surfaces,\n  and vendor-specific everywhere else.\n- **Author each harness's config by hand** \u2014 four copies of the same rules, drifting\n  independently. This is the mistake `adapters/` exists to prevent.\n", "fm": {"date": "2026-08-19", "updated": "2026-08-29", "status": "accepted"}, "links": []}]}</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const md = s => marked.parse((s||'').replace(/^---[\s\S]*?\n---\n/, '')
  .replace(/\[\[([^\]|]+)\]\]/g, (_,n)=>`<span class="wl" data-go="${n}">${n}</span>`));
document.getElementById('meta').textContent =
  `generated ${D.generated} · ${D.notes.length} wiki · ${D.raw.length} raw · ` +
  `${D.output.length} output · ${D.decisions.length} decisions · ` +
  `${D.loops.filter(l=>l.status==='open').length} open loops`;

const views = {
  Overview(){
    const open = D.loops.filter(l=>l.status==='open');
    return card('WORKING MEMORY', md(D.state))
      + (open.length ? open.map(loopCard).join('') : card('LOOPS','<p class="dim">no open loops</p>'))
      + card('LESSONS', md(D.lessons))
      + (D.journal[0] ? card('LATEST JOURNAL — '+D.journal[0].name, md(D.journal[0].body)) : '');
  },
  Loops(){ return D.loops.length ? D.loops.map(loopCard).join('') : '<p class="dim">no loops</p>'; },
  Notes(){
    return `<div class="card"><input id="q" placeholder="filter notes…" size="30"></div>`
      + `<div id="notes">` + D.notes.map(n =>
        `<div class="card note" data-n="${n.name.toLowerCase()}" id="n-${cssid(n.name)}">
           <h3>${n.name}</h3>${md(n.body)}
           ${n.links.length?`<p class="dim">links: ${n.links.map(l=>`<span class="wl" data-go="${l}">${l}</span>`).join(', ')}</p>`:''}
         </div>`).join('') + `</div>`;
  },
  Output(){ return D.output.map(o=>card(o.name + statusOf(o), md(o.body))).join('')
    || '<p class="dim">nothing shipped yet — bin/os ship "Title"</p>'; },
  Raw(){ return D.raw.map(r=>`<details class="card"><summary>${r.name}</summary>${md(r.body)}</details>`).join('')
    || '<p class="dim">no captures yet — bin/os capture "Title" [url]</p>'; },
  Decisions(){ return D.decisions.map(d=>card(d.name, md(d.body))).join('') || '<p class="dim">none</p>'; },
  Journal(){ return D.journal.map(j=>`<details class="card" open><summary>${j.name}</summary>${md(j.body)}</details>`).join('') || '<p class="dim">none</p>'; },
};
function statusOf(o){ const s=(o.fm||{}).status; return s?` <span class="dim">${s}</span>`:''; }
function card(t,b){ return `<div class="card"><h3>${t}</h3>${b}</div>`; }
function cssid(s){ return s.replace(/[^a-z0-9]/gi,'-').toLowerCase(); }
function loopCard(l){
  const done = l.steps.filter(s=>s[0]).length, pct = l.steps.length ? done/l.steps.length*100 : 0;
  return `<div class="card"><h3>LOOP · ${l.name} <span class="dim">${l.status} · ${done}/${l.steps.length}</span></h3>
    <div class="bar"><i style="width:${pct}%"></i></div>${md(l.body)}</div>`;
}
let cur = 'Overview';
function render(){
  document.getElementById('nav').innerHTML = Object.keys(views)
    .map(k=>`<button class="${k===cur?'on':''}" data-v="${k}">${k}</button>`).join('');
  document.getElementById('app').innerHTML = views[cur]();
}
document.addEventListener('click', e => {
  const v = e.target.dataset.v, go = e.target.dataset.go;
  if (v) { cur = v; render(); }
  if (go) { cur = 'Notes'; render();
    const el = document.getElementById('n-'+cssid(go));
    el ? el.scrollIntoView({behavior:'smooth'}) : alert('No note yet: '+go); }
});
document.addEventListener('input', e => {
  if (e.target.id !== 'q') return;
  const q = e.target.value.toLowerCase();
  document.querySelectorAll('.note').forEach(n =>
    n.classList.toggle('hide', !n.dataset.n.includes(q)));
});
render();
</script>
